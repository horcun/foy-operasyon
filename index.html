<style>
:root{
  --zemin:#F3F1ED; --kenar:#FAF8F5; --kart:#FFFFFF; --yuzey:#F7F5F1; --cizgi:#E2DDD4; --cizgi-a:#ECE8E1;
  --yazi:#1E1C19; --soluk:#665F56; --golge:0 1px 2px rgba(40,30,20,.05), 0 2px 8px -4px rgba(40,30,20,.08);
  --kirmizi:#B42318; --kirmizi-zemin:#FDEBEA; --sari:#8A5A00; --sari-zemin:#FFF2CF; --sari-cizgi:#E2A400;
  --yesil:#17663B; --yesil-zemin:#E2F3E8; --balon:#1E1C19; --balon-yazi:#FFFFFF;
  --marka-a:#9E2A4B; --marka-k:#F07A9B; --marka:var(--marka-a); --marka-on:#FFFFFF;
  --marka-zemin:color-mix(in srgb, var(--marka) 9%, var(--kart));
  --marka-orta:color-mix(in srgb, var(--marka) 55%, var(--kart));
  --marka-acik:color-mix(in srgb, var(--marka) 28%, var(--kart));
  --f-baslik:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-govde:"Figtree", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --hiz:200ms; --kenar-g:244px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --zemin:#121110; --kenar:#171614; --kart:#1F1E1B; --yuzey:#191816; --cizgi:#36322C; --cizgi-a:#2A2723;
  --yazi:#EEEBE6; --soluk:#A8A197; --golge:0 1px 2px rgba(0,0,0,.4);
  --kirmizi:#FF7A70; --kirmizi-zemin:#3A1714; --sari:#F2BE55; --sari-zemin:#352A10; --sari-cizgi:#C99320;
  --yesil:#62D193; --yesil-zemin:#11301F; --balon:#EEEBE6; --balon-yazi:#121110;
  --marka:var(--marka-k); --marka-on:#121110; color-scheme:dark}}
:root[data-theme="dark"]{
  --zemin:#121110; --kenar:#171614; --kart:#1F1E1B; --yuzey:#191816; --cizgi:#36322C; --cizgi-a:#2A2723;
  --yazi:#EEEBE6; --soluk:#A8A197; --golge:0 1px 2px rgba(0,0,0,.4);
  --kirmizi:#FF7A70; --kirmizi-zemin:#3A1714; --sari:#F2BE55; --sari-zemin:#352A10; --sari-cizgi:#C99320;
  --yesil:#62D193; --yesil-zemin:#11301F; --balon:#EEEBE6; --balon-yazi:#121110;
  --marka:var(--marka-k); --marka-on:#121110; color-scheme:dark}
@media (prefers-reduced-motion: reduce){:root{--hiz:1ms}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--zemin); color:var(--yazi); font-family:var(--f-govde); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--marka); outline-offset:2px}
.tn{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0}
svg{flex:none}

/* ---------- iskelet ---------- */
.uygulama{display:grid; grid-template-columns:var(--kenar-g) minmax(0,1fr); min-height:100vh}
.kenar{position:sticky; top:0; height:100vh; overflow-y:auto; overflow-x:hidden; background:var(--kenar); border-right:1px solid var(--cizgi); display:flex; flex-direction:column; gap:18px; padding:18px 14px 14px}
.logo-satir{display:flex; align-items:center; gap:10px; font-family:var(--f-baslik); font-weight:800; font-size:20px; letter-spacing:-.02em; padding:2px 6px; white-space:nowrap}
.logo-satir svg{width:28px; height:28px; color:var(--yazi)}
.kenar h2{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--soluk); font-weight:700; padding:0 6px; margin-bottom:6px}
.marka-btn{display:flex; align-items:center; gap:10px; padding:7px 8px; border:1px solid transparent; border-radius:10px; background:none; text-align:left; width:100%}
.marka-btn:hover{background:var(--yuzey)}
.marka-btn[aria-pressed="true"]{background:var(--kart); border-color:var(--cizgi); box-shadow:var(--golge)}
.marka-btn .ad{font-weight:600; font-size:14px; line-height:1.2; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.marka-btn small{display:block; color:var(--soluk); font-size:12px; white-space:nowrap}
.mlogo{width:30px; height:30px; flex:none; display:grid; place-items:center; color:#fff; font-family:var(--f-baslik); font-weight:800; font-size:15px}
.mlogo.daire{border-radius:50%} .mlogo.kare{border-radius:8px} .mlogo.yaprak{border-radius:50% 4px 50% 4px}
.menu{display:flex; flex-direction:column; gap:2px}
.menu-btn{display:flex; align-items:center; gap:11px; padding:9px 10px; border:0; border-radius:9px; background:none; font-weight:600; font-size:14px; color:var(--soluk); width:100%; text-align:left; position:relative}
.menu-btn svg{width:20px; height:20px}
.menu-btn:hover{background:var(--yuzey); color:var(--yazi)}
.menu-btn[aria-current="page"]{background:var(--marka-zemin); color:var(--marka)}
.menu-btn[aria-current="page"]::before{content:""; position:absolute; left:-14px; top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0; background:var(--marka)}
.menu-btn .say{margin-left:auto}
.say{min-width:22px; height:20px; padding:0 6px; border-radius:10px; font-size:12px; font-weight:700; line-height:20px; text-align:center; font-variant-numeric:tabular-nums; background:var(--cizgi-a); color:var(--yazi)}
.say.kirmizi{background:var(--kirmizi); color:var(--kart)}
.kenar-alt{margin-top:auto; display:flex; flex-direction:column; gap:10px}
.ornek-not{font-size:12px; color:var(--soluk); border:1px dashed var(--cizgi); border-radius:10px; padding:8px 10px; display:flex; gap:7px; align-items:flex-start}
.ornek-not svg{width:14px; height:14px; margin-top:2px}
.kullanici{display:flex; align-items:center; gap:10px; padding:6px; font-size:13px}
.kullanici small{display:block; color:var(--soluk); font-size:12px}
.avatar{width:32px; height:32px; border-radius:50%; background:var(--cizgi-a); display:grid; place-items:center; font-weight:700; flex:none}

.ana{min-width:0; display:flex; flex-direction:column}
.ust{position:sticky; top:0; z-index:10; background:color-mix(in srgb, var(--zemin) 92%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--cizgi); padding:14px 24px 12px; display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px}
.ust-bas{display:flex; flex-direction:column; min-width:0; margin-right:auto}
.ust-bas h1{font-family:var(--f-baslik); font-weight:800; font-size:24px; letter-spacing:-.02em; line-height:1.1}
.ust-bas .zaman{font-size:13px; color:var(--soluk)}
.ust-sag{display:flex; align-items:center; gap:10px; flex-wrap:wrap; min-width:0}
.arama{position:relative; width:260px; max-width:100%}
.arama svg{position:absolute; left:10px; top:50%; translate:0 -50%; width:16px; height:16px; color:var(--soluk)}
.arama input{width:100%; padding:8px 10px 8px 32px; border:1px solid var(--cizgi); border-radius:9px; background:var(--kart); font-size:14px}
.cipler{display:flex; gap:6px; flex-wrap:wrap}
.cip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--cizgi); background:var(--kart); border-radius:999px; padding:5px 11px; font-size:13px; font-weight:600; color:var(--soluk)}
.cip[aria-pressed="true"]{background:var(--yazi); border-color:var(--yazi); color:var(--kart)}
.ornek-rozet{font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:4px 8px; border:1px dashed var(--soluk); border-radius:6px; color:var(--soluk); white-space:nowrap}

.sayfa{padding:22px 24px 40px; display:flex; flex-direction:column; gap:20px; min-width:0}
.alt-sekme{display:none}

/* ---------- ortak ---------- */
.kart{background:var(--kart); border:1px solid var(--cizgi); border-radius:14px; box-shadow:var(--golge); min-width:0}
.kart-bas{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px 10px; flex-wrap:wrap}
.kart-bas h2{font-family:var(--f-baslik); font-size:17px; font-weight:700; letter-spacing:-.01em}
.kart-bas p{margin:0; font-size:13px; color:var(--soluk)}
.rozet{display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:700; padding:2px 8px 2px 6px; border-radius:999px; white-space:nowrap; line-height:1.5}
.rozet svg{width:13px; height:13px}
.r-kirmizi{background:var(--kirmizi-zemin); color:var(--kirmizi)}
.r-sari{background:var(--sari-zemin); color:var(--sari)}
.r-yesil{background:var(--yesil-zemin); color:var(--yesil)}
.r-gri{background:var(--cizgi-a); color:var(--soluk)}
.kanal{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:1px 7px; border-radius:5px; border:1px solid var(--cizgi); color:var(--soluk); white-space:nowrap; background:var(--kart)}
.kanal i{width:7px; height:7px; display:inline-block; background:var(--soluk); flex:none}
.kanal.trendyol i{border-radius:1px} .kanal.hepsiburada i{border-radius:50%; background:transparent; border:1.5px solid var(--soluk)}
.kanal.site i{transform:rotate(45deg)} .kanal.whatsapp i{border-radius:50% 50% 50% 0}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--cizgi); background:var(--kart); border-radius:9px; padding:8px 13px; font-size:14px; font-weight:600; white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--yazi)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.birincil{background:var(--marka); border-color:var(--marka); color:var(--marka-on)}
.btn.birincil:hover:not(:disabled){filter:brightness(1.08); border-color:var(--marka)}
.btn.kucuk{padding:5px 9px; font-size:13px}
.btn svg{width:15px; height:15px}
.asim{color:var(--kirmizi); font-weight:700; display:inline-flex; align-items:center; gap:4px; white-space:nowrap}
.asim svg{width:13px; height:13px}
.soluk{color:var(--soluk)}
.not{display:flex; gap:8px; align-items:flex-start; font-size:13px; padding:10px 12px; border-radius:10px; background:var(--marka-zemin); margin:0}
.not svg{width:16px; height:16px; margin-top:1px; color:var(--marka)}
.bos{padding:28px 16px; text-align:center; color:var(--soluk); font-size:14px}
.vurgu{animation:vurgu 1.4s ease-in-out 2}
@keyframes vurgu{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 5px color-mix(in srgb, var(--marka) 45%, transparent)}}
tr.vurgu td{animation:vurgu-td 1.4s ease-in-out 2}
@keyframes vurgu-td{0%,100%{background:transparent}50%{background:color-mix(in srgb, var(--marka) 16%, var(--kart))}}

/* tablo */
.tablo-kap{overflow-x:auto; min-width:0; -webkit-overflow-scrolling:touch}
table{width:100%; border-collapse:collapse; font-size:13.5px}
th{font-size:12px; font-weight:700; color:var(--soluk); text-align:left; padding:9px 9px; border-bottom:1px solid var(--cizgi); white-space:nowrap; background:var(--yuzey)}
td{padding:10px 9px; border-bottom:1px solid var(--cizgi-a); vertical-align:middle; white-space:nowrap}
th:first-child, td:first-child{padding-left:16px} th:last-child, td:last-child{padding-right:16px}
tbody tr:last-child td{border-bottom:0}
tbody tr.tik{cursor:pointer}
tbody tr.tik:hover td, tbody tr.secili td{background:var(--marka-zemin)}
th button{border:0; background:none; padding:0; font:inherit; color:inherit; display:inline-flex; align-items:center; gap:4px}
th button:hover{color:var(--yazi)}
th[aria-sort] button{color:var(--yazi)}
th .ok{font-size:10px}
td.sayi, th.sayi{text-align:right}
.hucre-ana{font-weight:600}
.hucre-alt{font-size:12px; color:var(--soluk)}
.urun-h{max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
td select{padding:5px 6px; border:1px solid var(--cizgi); border-radius:7px; background:var(--kart); font-size:13px; width:auto; min-width:96px}
input[type=checkbox]{width:16px; height:16px; accent-color:var(--marka); margin:0; vertical-align:middle}

/* ---------- genel bakış ---------- */
.kpi-sira{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px}
.kpi{padding:16px 16px 14px; display:flex; flex-direction:column; gap:8px; text-align:left; border:1px solid var(--cizgi); background:var(--kart); border-radius:14px; box-shadow:var(--golge); position:relative; overflow:hidden}
.kpi:hover{border-color:var(--soluk)}
.kpi::after{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--cizgi)}
.kpi.s-kirmizi::after{background:var(--kirmizi)} .kpi.s-sari::after{background:var(--sari-cizgi)} .kpi.s-yesil::after{background:var(--yesil)}
.kpi .et{font-size:13px; font-weight:600; color:var(--soluk); display:flex; align-items:center; gap:7px}
.kpi .et svg{width:17px; height:17px}
.kpi .deger{font-family:var(--f-govde); font-weight:700; font-size:38px; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.kpi .alt{font-size:12.5px; color:var(--soluk); display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.genel-izgara{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:20px; align-items:start}
.sag-sutun{display:flex; flex-direction:column; gap:20px; min-width:0}
.tur-h{display:inline-flex; align-items:center; gap:6px; font-weight:600}
.tur-h svg{width:16px; height:16px; color:var(--soluk)}
.ozet-govde{padding:0 16px 16px; display:flex; flex-direction:column; gap:10px}
.balon-mesaj{background:var(--marka-zemin); border-radius:4px 14px 14px 14px; padding:11px 13px; font-size:13.5px; display:flex; flex-direction:column; gap:4px}
.balon-mesaj .zaman{align-self:flex-end; font-size:11px; color:var(--soluk)}
.ozet-kanal{display:flex; gap:6px; flex-wrap:wrap}
.grafik{padding:2px 16px 16px; display:flex; flex-direction:column; gap:10px}
.g-satir{display:grid; grid-template-columns:96px minmax(0,1fr) 28px; gap:10px; align-items:center; font-size:13px}
.g-cubuk{height:16px; display:flex; background:var(--yuzey); border-radius:4px; overflow:hidden; position:relative}
.g-cubuk span{height:100%}
.g-cubuk span+span{border-left:2px solid var(--kart)}
.g-eksen{display:grid; grid-template-columns:96px minmax(0,1fr) 28px; gap:10px; font-size:11px; color:var(--soluk)}
.g-eksen .olcek{position:relative; height:14px; border-top:1px solid var(--cizgi)}
.g-eksen .olcek span{position:absolute; top:2px; translate:-50% 0; font-variant-numeric:tabular-nums}
.g-eksen .olcek span:first-child{translate:0 0}
.g-eksen .olcek span:last-child{translate:-100% 0}
.lejant{display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--soluk)}
.lejant i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px}
.c1{background:var(--marka)} .c2{background:var(--marka-orta)} .c3{background:var(--marka-acik)}

/* ---------- sorular ---------- */
.gelen{display:grid; grid-template-columns:380px minmax(0,1fr); gap:0; overflow:hidden; min-height:560px}
.gelen-liste{border-right:1px solid var(--cizgi); display:flex; flex-direction:column; min-width:0; max-height:calc(100vh - 160px); overflow-y:auto}
.grup-bas{display:flex; justify-content:space-between; font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--soluk); padding:12px 16px 6px; background:var(--yuzey); border-bottom:1px solid var(--cizgi-a); position:sticky; top:0; z-index:1}
.soru-satir{display:flex; flex-direction:column; gap:5px; padding:12px 16px; border:0; border-bottom:1px solid var(--cizgi-a); background:none; text-align:left; width:100%; position:relative}
.soru-satir:hover{background:var(--yuzey)}
.soru-satir[aria-current="true"]{background:var(--marka-zemin)}
.soru-satir[aria-current="true"]::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--marka)}
.soru-satir .s1{display:flex; align-items:center; gap:8px}
.soru-satir .s1 .m{font-weight:700}
.soru-satir .s1 .bk{margin-left:auto; font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--soluk); white-space:nowrap}
.soru-satir.s-kirmizi .bk{color:var(--kirmizi); font-weight:700}
.soru-satir.s-sari .bk{color:var(--sari); font-weight:700}
.soru-satir .s2{font-size:12.5px; color:var(--soluk); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.soru-satir .s3{font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.soru-satir.cevaplandi{opacity:.65}
.detay{padding:20px 24px 24px; display:flex; flex-direction:column; gap:16px; min-width:0}
.detay-bas{display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap}
.detay-bas h2{font-family:var(--f-baslik); font-size:21px; font-weight:700}
.detay-bas .sag{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.soru-balon{background:var(--yuzey); border:1px solid var(--cizgi-a); border-radius:4px 14px 14px 14px; padding:12px 14px; font-size:15.5px; max-width:640px}
.bekleme{font-size:13px; color:var(--soluk)} .bekleme b{font-size:15px; color:var(--yazi); font-variant-numeric:tabular-nums}
.s-kirmizi .bekleme b{color:var(--kirmizi)} .s-sari .bekleme b{color:var(--sari)}
.baglam{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--cizgi-a); border:1px solid var(--cizgi-a); border-radius:10px; overflow:hidden}
.baglam div{background:var(--kart); padding:9px 12px; font-size:13px; min-width:0}
.baglam small{display:block; font-size:11px; color:var(--soluk); text-transform:uppercase; letter-spacing:.06em; font-weight:700}
.taslak{border:1px solid var(--cizgi); border-radius:12px; overflow:hidden}
.taslak-ust{display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; padding:8px 12px; background:var(--marka-zemin); font-size:12.5px}
.taslak-ust b{color:var(--marka); display:inline-flex; align-items:center; gap:6px}
.taslak-ust b svg{width:14px; height:14px}
textarea{width:100%; border:0; padding:12px; resize:vertical; background:var(--kart); min-height:130px; display:block; font-size:14.5px; line-height:1.5}
textarea.duzenleniyor{background:var(--yuzey); box-shadow:inset 0 0 0 2px var(--marka)}
.onay-notu{display:flex; gap:8px; font-size:13px; margin:0; padding:10px 12px; border-radius:10px; background:var(--yuzey); border:1px solid var(--cizgi-a)}
.onay-notu svg{width:16px; height:16px; margin-top:1px}
.eylemler{display:flex; gap:8px; flex-wrap:wrap}
.eylemler .btn.birincil{padding:9px 18px}

/* ---------- siparişler ---------- */
.sekme-sira{display:flex; gap:4px; border-bottom:1px solid var(--cizgi); padding:0 16px; overflow-x:auto}
.sekme{border:0; background:none; padding:12px 12px 10px; font-weight:600; font-size:14px; color:var(--soluk); border-bottom:2px solid transparent; margin-bottom:-1px; display:inline-flex; gap:7px; align-items:center; white-space:nowrap}
.sekme[aria-selected="true"]{color:var(--yazi); border-bottom-color:var(--marka)}
.eylem-cubugu{display:flex; align-items:center; gap:12px; padding:10px 16px; flex-wrap:wrap; border-bottom:1px solid var(--cizgi-a)}
.eylem-cubugu .bilgi{font-size:13px; color:var(--soluk); margin-right:auto}
.takip-eksik{color:var(--sari); font-weight:700; display:inline-flex; gap:4px; align-items:center; white-space:nowrap}
.takip-eksik svg{width:13px; height:13px}
.mesaj-gitti{font-size:12px; color:var(--yesil); display:flex; align-items:center; gap:3px; margin-top:3px; white-space:nowrap}
.mesaj-gitti svg{width:11px; height:11px}

/* ---------- iadeler ---------- */
.kanban-kap{overflow-x:auto; min-width:0; padding-bottom:6px; -webkit-overflow-scrolling:touch}
.kanban{display:grid; grid-template-columns:repeat(4,minmax(220px,1fr)); gap:12px; min-width:min-content}
.sutun{background:var(--yuzey); border:1px solid var(--cizgi-a); border-radius:14px; padding:10px; display:flex; flex-direction:column; gap:10px; min-height:340px}
.sutun-bas{display:flex; align-items:center; gap:8px; font-weight:700; font-size:13.5px; padding:2px 4px}
.sutun-bas .no{width:20px; height:20px; border-radius:50%; background:var(--kart); border:1px solid var(--cizgi); display:grid; place-items:center; font-size:11px; color:var(--soluk); flex:none}
.sutun-bas .say{margin-left:auto}
.iade-kart{background:var(--kart); border:1px solid var(--cizgi); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:9px; box-shadow:var(--golge); transition:transform var(--hiz)}
.iade-kart.s-kirmizi{border-color:color-mix(in srgb, var(--kirmizi) 50%, var(--cizgi))}
.iade-kart.yeni{animation:gir .45s ease-out}
@keyframes gir{from{transform:translateX(-14px); opacity:.3}to{transform:none; opacity:1}}
.ik-ust{display:flex; align-items:center; gap:6px; justify-content:space-between}
.ik-ust .rno{font-weight:700; font-variant-numeric:tabular-nums; font-size:13px}
.ik-urun{font-weight:600; font-size:14px; line-height:1.3}
.ik-bilgi{display:flex; justify-content:space-between; font-size:12.5px; color:var(--soluk); gap:6px; flex-wrap:wrap}
.ik-bilgi b{color:var(--yazi); font-variant-numeric:tabular-nums}
.sinir{display:flex; flex-direction:column; gap:4px}
.sinir .et{display:flex; justify-content:space-between; font-size:12px; color:var(--soluk); gap:6px}
.sinir .et b{font-variant-numeric:tabular-nums; color:var(--yazi)}
.s-kirmizi .sinir .kal{color:var(--kirmizi); font-weight:700}
.s-sari .sinir .kal{color:var(--sari); font-weight:700}
.s-yesil .sinir .kal{color:var(--yesil); font-weight:700}
.kal{display:inline-flex; gap:4px; align-items:center; font-size:12.5px}
.kal svg{width:12px; height:12px}
.bar{height:8px; border-radius:4px; background:var(--cizgi-a); position:relative; overflow:hidden}
.bar span{position:absolute; inset:0 auto 0 0; border-radius:4px; background:var(--yesil)}
.s-sari .bar span{background:var(--sari-cizgi)}
.s-kirmizi .bar span{background:repeating-linear-gradient(135deg, var(--kirmizi) 0 4px, color-mix(in srgb, var(--kirmizi) 65%, var(--kart)) 4px 7px)}
.bar i{position:absolute; top:0; bottom:0; width:1px; background:var(--kart); opacity:.9}
.foto{display:flex; gap:5px; align-items:center; font-size:12px; color:var(--soluk)}
.foto i{width:26px; height:26px; border-radius:5px; display:block; background:linear-gradient(135deg, var(--marka-zemin), var(--marka-acik)); border:1px solid var(--cizgi)}
.ik-eylem{display:flex; flex-direction:column; gap:6px}
.ik-eylem .btn{width:100%; white-space:normal}

/* ---------- ayarlar ---------- */
.ayar-izgara{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px; align-items:start}
.form{display:flex; flex-direction:column; gap:0}
.f-bolum{padding:16px 18px; border-bottom:1px solid var(--cizgi-a); display:flex; flex-direction:column; gap:12px}
.f-bolum:last-child{border-bottom:0}
.f-bolum h3{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--soluk); font-weight:700}
.f-satir{display:grid; grid-template-columns:170px minmax(0,1fr); gap:6px 14px; align-items:center}
.f-satir > label, .f-satir > .lbl{font-weight:600; font-size:13.5px}
.f-satir > .secim{justify-self:start}
.f-satir .yardim{grid-column:2; font-size:12px; color:var(--soluk)}
input[type=text], select{padding:8px 10px; border:1px solid var(--cizgi); border-radius:9px; background:var(--kart); font-size:14px; width:100%; min-width:0}
.secim{display:inline-flex; border:1px solid var(--cizgi); border-radius:9px; overflow:hidden; background:var(--kart); flex-wrap:wrap}
.secim button{border:0; background:none; padding:7px 14px; font-size:13.5px; font-weight:600; color:var(--soluk)}
.secim button+button{border-left:1px solid var(--cizgi)}
.secim button[aria-pressed="true"]{background:var(--marka); color:var(--marka-on)}
.renkler{display:flex; gap:9px; flex-wrap:wrap}
.renk{width:30px; height:30px; border-radius:50%; border:3px solid var(--kart); box-shadow:0 0 0 1px var(--cizgi); padding:0}
.renk[aria-pressed="true"]{box-shadow:0 0 0 2px var(--yazi)}
.kanal-sec{display:flex; gap:8px; flex-wrap:wrap}
.anahtar-et{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--cizgi); border-radius:9px; padding:6px 10px; font-size:13.5px; font-weight:600; background:var(--kart)}
.anahtar{width:34px; height:20px; border-radius:10px; border:0; background:var(--cizgi); position:relative; flex:none; padding:0}
.anahtar::after{content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--kart); transition:transform var(--hiz)}
.anahtar[aria-checked="true"]{background:var(--marka)}
.anahtar[aria-checked="true"]::after{transform:translateX(14px)}
.ekip{display:flex; flex-direction:column; gap:6px}
.ekip-satir{display:flex; align-items:center; gap:8px; font-size:13.5px; padding:5px 8px; border:1px solid var(--cizgi-a); border-radius:9px}
.ekip-satir .rol{color:var(--soluk); font-size:12.5px}
.ekip-satir .sil{margin-left:auto; border:0; background:none; color:var(--soluk); font-size:12.5px; padding:2px 6px; border-radius:6px}
.ekip-satir .sil:hover{color:var(--kirmizi)}
.ekip-ekle{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto; gap:6px}
.onizleme{position:sticky; top:96px; display:flex; flex-direction:column; gap:0; overflow:hidden}
.oz-govde{padding:0 18px 18px; display:flex; flex-direction:column; gap:14px}
.oz-ust{display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--cizgi-a); border-radius:10px}
.oz-ust b{font-family:var(--f-baslik); font-size:16px}
.oz-ust .btn{margin-left:auto}
.oz-kpi{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.oz-kpi div{border:1px solid var(--cizgi-a); border-radius:10px; padding:8px 10px; font-size:12px; color:var(--soluk)}
.oz-kpi b{display:block; font-size:22px; color:var(--yazi); font-variant-numeric:tabular-nums}

/* ---------- katman: yan panel ve pencere ---------- */
.perde{position:fixed; inset:0; z-index:40; background:rgba(15,12,10,.42); opacity:0; transition:opacity var(--hiz); display:flex}
.perde.acik{opacity:1}
.panel{background:var(--kart); display:flex; flex-direction:column; max-height:100%; overflow:hidden}
.perde.yan{justify-content:flex-end}
.perde.yan .panel{width:min(480px,100%); height:100%; transform:translateX(30px); transition:transform var(--hiz); border-left:1px solid var(--cizgi)}
.perde.orta{align-items:center; justify-content:center; padding:16px}
.perde.orta .panel{width:min(520px,100%); border-radius:16px; transform:translateY(12px); transition:transform var(--hiz); max-height:calc(100vh - 32px)}
.perde.acik .panel{transform:none}
.panel-bas{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:16px 18px; border-bottom:1px solid var(--cizgi-a)}
.panel-bas h3{font-family:var(--f-baslik); font-size:19px}
.panel-govde{padding:16px 18px; overflow-y:auto; display:flex; flex-direction:column; gap:14px; flex:1}
.panel-alt{padding:14px 18px; border-top:1px solid var(--cizgi-a); display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap}
.kapat{border:0; background:var(--yuzey); width:32px; height:32px; border-radius:50%; font-size:20px; line-height:1; display:grid; place-items:center}
.tarayici{border:1px solid var(--cizgi); border-radius:12px; overflow:hidden}
.tarayici .adres{font-size:12px; padding:7px 10px; background:var(--yuzey); color:var(--soluk); border-bottom:1px solid var(--cizgi); display:flex; gap:8px; align-items:center; overflow:hidden; white-space:nowrap}
.tarayici .adres i{width:8px; height:8px; border-radius:50%; background:var(--cizgi); flex:none}
.musteri-sayfa{padding:16px; display:flex; flex-direction:column; gap:12px}
.musteri-sayfa h4{font-family:var(--f-baslik); font-size:21px}
.musteri-sayfa p{margin:0}
.dikey{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px}
.dikey li{display:flex; gap:10px; align-items:center; font-size:14px}
.dikey .top{width:22px; height:22px; border-radius:50%; border:2px solid var(--cizgi); flex:none; display:grid; place-items:center}
.dikey li.tamam .top{background:var(--marka); border-color:var(--marka); color:var(--marka-on)}
.dikey .top svg{width:12px; height:12px}
.dikey small{color:var(--soluk); margin-left:auto; font-variant-numeric:tabular-nums}
.dikey li.bekliyor{color:var(--soluk)}
.son-tarih{padding:10px; border-radius:10px; background:var(--marka-zemin)}

.bildirim{position:fixed; top:18px; left:50%; transform:translate(-50%,-16px); background:var(--balon); color:var(--balon-yazi); padding:10px 18px; border-radius:999px; font-size:14px; font-weight:600; z-index:90; opacity:0; transition:opacity var(--hiz), transform var(--hiz); pointer-events:none; display:flex; align-items:center; gap:8px; max-width:calc(100vw - 32px)}
.bildirim svg{width:15px; height:15px}
.bildirim.goster{opacity:1; transform:translate(-50%,0)}

/* ---------- deneme mağazası: kurulum, kanallar, stok, akış ---------- */
.marka-btn .yazi{min-width:0}
.marka-btn small{overflow:hidden; text-overflow:ellipsis}
.kanal.instagram i{border-radius:2px; background:transparent; border:1.5px solid var(--soluk)}

    const [text, x] = rast(SORU_SABLON.filter(s => s.kat === "*" || s.kat.includes(p.kat))).f(p);
    return soruEkle(k, "soru", m, p, text, x + IMZA, t);
  },
  mesaj(k, t){
    const m = musteri();
    if(Math.random() < 0.55){
      const p = urunSec(x => x.kat !== "Yedek parça" || Math.random() < 0.3);
      const v = p.vt ? rast(VARYANT[p.vt]) : null, adet = Math.random() < 0.8 ? 1 : 2, ve = v ? varyantEt(p, v) + " " : "", sh = rast(SEHIR);
      const text = ilkBuyuk(rast([
        `${ve}${p.kisa} kaldı mı, kapıda ödeme var mı?`,
        `Merhaba, ${adet > 1 ? adet + " tane " : ""}${ve}${p.kisa} almak istiyorum. ${sh[0]}${sh[1]} kargo kaç günde gelir?`,
        `${p.kisa} ${ve}var mı? ${adet} adet alacağım, havaleyle ödeyebilir miyim?`
      ]));
      const x = p.stok >= adet
        ? `Merhaba {ad}, evet, ${ve}${p.kisa} stokta; fiyatı ${tl(p.fiyat)}. Siparişi oluşturmamız için ad soyad, adres ve telefon [yazmanız|yazman] yeterli; ödeme seçeneklerini de hemen iletiyoruz. {marka}`
        : `Merhaba {ad}, ${p.kisa} şu an stokta yok. Gelince [size|sana] buradan haber verelim mi? {marka}`;
      return soruEkle(k, "mesaj", m, p, text, x, t, {sku:p.sku, varyant:v, adet});
    }
    const r = Math.random();
    if(r < 0.4){
      const p = urunSec();
      return soruEkle(k, "mesaj", m, p, `${ilkBuyuk(p.kisa)} hâlâ satışta mı? Fiyatı ne kadar?`,
        p.stok > 0 ? `Merhaba {ad}, evet satışta; fiyatı ${tl(p.fiyat)}, stokta var. [İsterseniz sizin|İstersen senin] için hemen ayıralım. {marka}` : `Merhaba {ad}, ${p.kisa} şu an stokta yok. Gelince [size|sana] haber verelim mi? {marka}`, t);
    }
    if(r < 0.7){
      const model = rast(MODELLER);
      const p = D.urunler.find(x => x.temel.startsWith("Ön Fren Balatası") && x.uyum.some(u => u.m === model));
      return soruEkle(k, "mesaj", m, p || null, `${model} için ön fren balatası var mı?`,
        p ? `Merhaba {ad}, evet: ${p.sku} kodlu ${p.ad}, fiyatı ${tl(p.fiyat)}${p.stok > 0 ? ", stokta var" : "; şu an stokta yok"}. {marka}`
          : `Merhaba {ad}, ${model} için ön fren balatası şu an listemizde yok; tedarik edip [size|sana] haber verebiliriz. {marka}`, t);
    }
    return soruEkle(k, "mesaj", m, null, "Mağazanız nerede, gelip deneyebilir miyim?",
      `Merhaba {ad}, adresimizi ve çalışma saatlerimizi hemen buradan paylaşıyoruz. Gelmeden önce [yazarsanız|yazarsan] denemek [istediğiniz|istediğin] ürünü ayırırız. {marka}`, t);
  },
  iade(k, t){
    const ad = D.siparisler.filter(s => s.kanal === k && s.status === "Shipped" && !D.iadeler.some(r => r.orderNumber === s.orderNumber));
    let m, line, no;
    if(ad.length && Math.random() < 0.7){ const s = rast(ad); m = {ad:s.customerName, c:s.c}; line = rast(s.lines); no = s.orderNumber; }
    else { m = musteri(); const p = urunSec(); const v = p.vt ? rast(VARYANT[p.vt]) : null; line = {productName:p.ad + (v ? ` · ${varyantEt(p, v)}` : ""), merchantSku:p.sku, price:p.fiyat}; no = yeniNo(k); }
    const p = urunBul(line.merchantSku);
    const nedenler = ["Hasarlı geldi","Yanlış ürün gönderildi","Beklentimi karşılamadı"];
    if(p && p.vt) nedenler.push("Beden uymadı","Beden uymadı");
    if(p && p.kat === "Yedek parça") nedenler.push("Motoruma uymadı","Motoruma uymadı");
    const r = {claimId:yeniIadeNo(), orderNumber:no, kanal:k, customerName:m.ad, c:m.c, claimDate:t,
      items:[{productName:line.productName, merchantSku:line.merchantSku, quantity:1, price:line.price}], reason:rast(nedenler),
      status:"Created", rejectReason:null, acceptedDate:null, closedDate:null, totalAmount:line.price};
    D.iadeler.unshift(r);
    akisEkle("iade", k, `İade talebi ${r.claimId} · ${m.ad} · ${r.reason}`, ["iadeler", r.claimId]);
    return {metin:`Yeni iade talebi · ${KANAL[k]} · ${r.claimId}`};
  }
};
function simAdim(ms){
  const S = D.sim; S.t += ms * S.hiz;
  const olaylar = []; let n = 0;
  while(S.t >= S.sonraki && n < 15){ const o = olayUret(S.sonraki); if(o) olaylar.push(o); S.sonraki += aralik(); n++; }
  if(S.sonraki < S.t) S.sonraki = S.t + aralik();
  return olaylar;
}

  </article>`;
  const fv = formlar[k] || {};
  return `<article class="kart kanal-kart" data-kanal-kart="${k}"><form data-kanal-form="${k}" novalidate>
    <div class="kk-bas">${kanalLogo(k)}<div><h3>${KANAL[k]}</h3><p>${t.getirir}</p></div></div>
    ${t.alanlar.map(a => `<label class="kk-alan"><span>${a.et}</span><input type="${a.tip}" name="${a.ad}" id="kf-${k}-${a.ad}" data-kf="${k}" placeholder="${esc(a.yer || (a.gizli ? "Anahtarı yapıştır" : ""))}" autocomplete="${a.tip === "password" ? "new-password" : "off"}" ${a.mod ? `inputmode="${a.mod}"` : ""} spellcheck="false" ${dg ? "disabled" : ""} value="${esc(fv[a.ad] || "")}"></label>`).join("")}
    <p class="kk-hata" id="kh-${k}" hidden></p>

function kartYenile(k){
  const el = document.querySelector(`[data-kanal-kart="${k}"]`);
  if(el) el.outerHTML = kanalKart(k);
  const d = $("#kur-durum"); if(d && D.kurulum.adim === 2 && !D.kurulum.tamam) d.textContent = kurDurumMetni();
}
function maskele(v){ const s = String(v).replace(/\s+/g, ""); return "•••• " + s.slice(-4); }
function kanalBagla(k, form){
  const t = KANAL_TANIM[k], deg = {};
  let hata = "";
  for(const a of t.alanlar){
    const v = (form.elements[a.ad].value || "").trim(); deg[a.ad] = v;
    if(!v){ hata = `${a.et} boş bırakılamaz.`; break; }
    if(a.tip === "password" && v.length < 6){ hata = `${a.et} en az 6 karakter olmalı.`; break; }
    if(a.tip === "tel" && v.replace(/\D/g, "").length < 10){ hata = "Telefon numarası en az 10 haneli olmalı."; break; }
    if(a.ad === "hesap" && !/^@?[A-Za-z0-9._]{2,30}$/.test(v)){ hata = "Hesap adı yalnız harf, rakam, nokta ve alt çizgi içerebilir."; break; }
    if(a.ad === "adres" && !/\./.test(v)){ hata = "Site adresini tam yaz (ör. magazam.example)."; break; }
  }
  const h = $(`#kh-${k}`);
  if(hata){ if(h){ h.textContent = hata; h.hidden = false; } return; }
  const bilgi = {};
  t.alanlar.forEach(a => { const v = deg[a.ad]; bilgi[a.ad] = a.gizli ? maskele(v) : a.ad === "hesap" ? "@" + v.replace(/^@/, "") : v; });
  dogrulaniyor[k] = true; kartYenile(k);
  setTimeout(() => {
    delete dogrulaniyor[k]; delete formlar[k];
    D.kanallar[k] = {bagli:true, bilgi, tarih:simdi()};
    if(D.kurulum.tamam) akisEkle("kanal", k, `${KANAL[k]} bağlandı · deneme bağlantısı`);
    kaydet();
    if(D.kurulum.tamam && sayfa === "ayarlar"){ ciz(); } else kartYenile(k);
    if(D.kurulum.tamam) menuCiz();
    bildir(`${KANAL[k]} bağlandı · deneme bağlantısı`);
  }, 1100 + Math.floor(Math.random()*700));
}

      </section>

        ${az.length ? `<ol class="akis">${az.map(p => `<li><button data-git-sayfa="stok" data-git-id="${esc(p.sku)}"><span class="sa tn">${p.stok}</span><span class="mt"><span>${esc(p.ad)}</span><span class="hucre-alt">${esc(p.sku)} · ${STOK_ET[stokDurum(p)]}</span></span></button></li>`).join("")}</ol>` : `<p class="bos" style="padding-top:8px">Azalan ürün yok.</p>`}

/* ---------- sorular ve mesajlar ---------- */
const cevrilebilir = q => q.tur === "mesaj" && !q.cevrildi;
function cizSorular(){
  const acikL = acikSorular().filter(soruEsle), bitti = soruListe().filter(q => !soruAcik(q)).filter(soruEsle).sort((a,b) => b.answer.creationDate - a.answer.creationDate);
  const tum = [...acikL, ...bitti];
  if(!tum.some(q => q.id === secSoru)) secSoru = (acikL[0] || bitti[0] || {}).id || null;
  const satir = q => {
    const c = !soruAcik(q), d = c ? "yesil" : soruDurum(q);
    return `<button class="soru-satir s-${d}${c ? " cevaplandi" : ""}" data-soru="${q.id}" aria-current="${q.id === secSoru}">
      <span class="s1">${kanal(q.kanal)}<span class="m">${esc(q.customerName)}</span><span class="bk">${c ? "Cevaplandı" : `<span class="canli" data-bas="${q.creationDate}">${sure(simdi() - q.creationDate)}</span>`}</span></span>
      <span class="s2">${TUR_AD[q.tur]}${q.istek ? " · sipariş isteği" : ""}${q.cevrildi ? " · siparişe çevrildi" : ""}${q.productName ? " · " + esc(q.productName) : ""}</span>
      <span class="s3">${esc(q.text)}</span>
      ${!c && d !== "yesil" ? `<span>${rozet(d, SOR_ET[d])}</span>` : ""}
    </button>`;
  };
  const q = D.sorular.find(x => x.id === secSoru);
  return `
  <p class="onay-notu">${IK.kilit}<span>Her soruya ve mesaja bir taslak hazırlanır; <b>sen göndermeden hiçbir cevap gitmez.</b> Deneme mağazasında cevaplar müşteriye ulaşmaz, yalnız kayda geçer. Hedef: soru ${hedefMetin(D.soruHedefDk)} · mesaj ${hedefMetin(D.mesajHedefDk)}.</span></p>
  <section class="kart gelen">
    <div class="gelen-liste" id="soru-liste">
      <div class="grup-bas"><span>Bekliyor</span><span class="tn">${acikL.length}</span></div>
      ${acikL.map(satir).join("") || `<p class="bos">Bekleyen soru ya da mesaj yok.</p>`}
      ${bitti.length ? `<div class="grup-bas"><span>Cevaplandı</span><span class="tn">${bitti.length}</span></div>${bitti.map(satir).join("")}` : ""}
    </div>
    <div class="detay" id="soru-detay">${q ? soruDetay(q) : `<p class="bos">${soruListe().length ? "Bir soru ya da mesaj seç." : "Henüz soru ya da mesaj gelmedi. Bağlı kanallardan geldikçe burada görünür."}</p>`}</div>
  </section>`;
}
function soruDetay(q){
  const acik = soruAcik(q), d = soruDurum(q), p = q.merchantSku ? urunBul(q.merchantSku) : null;
  const sip = D.siparisler.find(s => s.customerName === q.customerName && s.kanal === q.kanal);
  const baglam = [];
  if(p){
    baglam.push(`<div><small>Ürün</small>${esc(p.ad)}</div>`, `<div><small>Stok kodu</small><span class="tn">${esc(p.sku)}</span></div>`,
      `<div><small>Stok</small>${rozet(stokDurum(p), p.stok + " adet")}</div>`, `<div><small>Fiyat</small><span class="tn">${tl(p.fiyat)}</span></div>`);
    if(p.uyum.length) baglam.push(`<div class="genis"><small>Uyumlu modeller</small>${esc(uyumMetin(p))}</div>`);
  }
  if(q.istek){ const ip = urunBul(q.istek.sku); baglam.push(`<div><small>İstenen</small>${q.istek.adet} adet${q.istek.varyant ? " · " + esc(varyantEt(ip, q.istek.varyant)) : ""}</div>`); }
  if(sip) baglam.push(`<div><small>Son siparişi</small><b class="tn">#${esc(sip.orderNumber)}</b> · ${esc(SIP_ET(sip))}</div>`);
  if(!baglam.length) baglam.push(`<div><small>Ürün</small>Belirli bir ürün yok</div>`, `<div><small>Kanal</small>${KANAL[q.kanal]}</div>`);
  const metin = taslaklar[q.id] != null ? taslaklar[q.id] : sablon(q.taslak, q);
  const yer = q.tur === "yorum" ? "Instagram gönderisinin altına yorum" : q.tur === "mesaj" ? `${KANAL[q.kanal]} mesajı` : `${KANAL[q.kanal]} ürün sorusu`;
  return `
    <div class="detay-bas s-${d}">
      <div><h2>${esc(q.customerName)}</h2><div class="bekleme" style="margin-top:4px">${kanal(q.kanal)} · ${yer} · ${acik ? `<b class="canli" data-bas="${q.creationDate}">${sure(simdi() - q.creationDate)}</b> bekliyor · hedef ${hedefMetin(hedefDk(q))}` : `cevaplandı`}</div></div>
      <div class="sag">${acik ? rozet(d, SOR_ET[d]) : rozet("yesil", "Cevaplandı")}</div>
    </div>
    <div class="konusma" data-konusma>
      <div class="soru-balon">${esc(q.text)}<span class="balon-zaman tn">${tarihSaat(q.creationDate)}</span></div>
      ${q.answer ? `<div class="cevap-balon" data-cevap-gecmis>${esc(q.answer.text)}<span class="balon-zaman tn">${IK.tik}Gönderildi · ${tarihSaat(q.answer.creationDate)}</span></div>` : ""}
    </div>
    <div><div class="bolum-et">Bağlam</div><div class="baglam">${baglam.join("")}</div></div>
    ${q.cevrildi ? `<p class="not">${IK.tik}<span>Siparişe çevrildi: <button class="link" data-git-sayfa="siparisler" data-git-id="${esc(q.cevrildi)}">#${esc(q.cevrildi)}</button></span></p>` : ""}
    ${acik ? `<div class="taslak" data-taslak>
        <div class="taslak-ust"><b>${IK.yildiz}Önerilen taslak</b><span>Düzenleyip gönder · Hitap: ${D.hitap === "siz" ? "Siz" : "Sen"}</span></div>
        <textarea id="cevap-metin" data-cevap="${q.id}" rows="5" aria-label="Cevap metni">${esc(metin)}</textarea>
      </div>
      <div class="eylemler"><button class="btn birincil" data-eylem="gonder" data-id="${q.id}">${IK.tik.replace('viewBox','width="14" height="14" viewBox')}Cevabı gönder</button>${cevrilebilir(q) ? `<button class="btn" data-eylem="cevir" data-id="${q.id}">${IK.siparisler}Siparişe çevir</button>` : ""}<button class="btn" data-eylem="atla" data-id="${q.id}">Atla</button></div>`
    : cevrilebilir(q) ? `<div class="eylemler"><button class="btn" data-eylem="cevir" data-id="${q.id}">${IK.siparisler}Siparişe çevir</button></div>` : ""}`;
}

/* ---------- siparişler ---------- */
const SIP_SEKME = [["gecikti","Gecikti"],["bugun","Bugün çıkmalı"],["kargoda","Kargoda"],["hepsi","Hepsi"]];
function sipSiralaDeger(s, k){
  switch(k){
    case "no": return s.orderNumber; case "kanal": return KANAL[s.kanal]; case "urun": return s.lines[0].productName; case "musteri": return s.customerName;
    case "tutar": return s.totalPrice; case "tarih": return s.orderDate; case "kalan": return s.status === "Shipped" ? Infinity : s.agreedDeliveryDate;
    case "sorumlu": return s.sorumlu || "~"; case "durum": return -AGIRLIK[sipDurum(s)];
  }
}
function cizSiparisler(){
  const ls = sipListe().filter(sipEsle);
  const say = {gecikti:0, bugun:0, kargoda:0, hepsi:ls.length};
  ls.forEach(s => { const g = sipGrup(s); if(say[g] != null) say[g]++; });
  const gor = ls.filter(s => sipSekme === "hepsi" || sipGrup(s) === sipSekme).sort((a,b) => {
    const x = sipSiralaDeger(a, sirala.k), y = sipSiralaDeger(b, sirala.k);
    const c = typeof x === "string" ? x.localeCompare(y, "tr") : (x === y ? 0 : x < y ? -1 : 1);
    return c * sirala.y || (b.orderDate - a.orderDate);
  });
  [...secili].forEach(no => { if(!gor.some(s => s.orderNumber === no && s.status !== "Shipped")) secili.delete(no); });
  const sec = gor.filter(s => s.status !== "Shipped");
  const hepsiSecili = sec.length && sec.every(s => secili.has(s.orderNumber));
  const th = (k, ad, cls) => `<th${cls ? ` class="${cls}"` : ""}${sirala.k === k ? ` aria-sort="${sirala.y > 0 ? "ascending" : "descending"}"` : ""}><button data-sirala="${k}">${ad}<span class="ok" aria-hidden="true">${sirala.k === k ? (sirala.y > 0 ? "▲" : "▼") : ""}</span></button></th>`;
  const satir = s => {
    const yol = s.status === "Shipped", yok = s.lines.some(l => l.stokYok), no = esc(s.orderNumber);
    return `<tr data-siparis="${no}" class="${secili.has(s.orderNumber) ? "secili" : ""}">
      <td><input type="checkbox" data-sec="${no}" ${secili.has(s.orderNumber) ? "checked" : ""} ${yol ? "disabled" : ""} aria-label="#${no} seç"></td>
      <td><div class="hucre-ana tn">#${no}</div><div class="hucre-alt tn">${tarihSaat(s.orderDate)}</div></td>
      <td>${kanal(s.kanal)}</td>
      <td><div class="urun-h" title="${esc(s.lines.map(l => l.quantity + " × " + l.productName).join("\n"))}">${esc(s.lines[0].productName)}</div><div class="hucre-alt">${toplamAdet(s)} adet${s.lines.length > 1 ? ` · ${s.lines.length} kalem` : ""}${s.kaynak ? " · mesajdan" : ""}</div>${yok ? `<div class="stok-uyari">${IK.kirmizi}Stokta yoktu</div>` : ""}</td>
      <td>${esc(s.customerName)}</td>
      <td class="tn sayi">${tl(s.totalPrice)}</td>
      <td class="tn" data-kalan>${yol ? `<span class="soluk">Kargoda</span>` : `<b class="canli" data-hedef="${s.agreedDeliveryDate}">${kalanHtml(s.agreedDeliveryDate)}</b><div class="hucre-alt">son: ${tarihSaat(s.agreedDeliveryDate)}</div>`}</td>
      <td data-takip>${yol ? `<div class="hucre-ana">${esc(s.cargoProviderName)}</div><div class="hucre-alt tn">${esc(s.cargoTrackingNumber)}</div>` : `<button class="btn kucuk birincil" data-eylem="kargo" data-id="${no}">${IK.kargo}Kargoya ver</button>`}</td>
      ${D.ekip.length ? `<td><select data-sip-sorumlu="${no}" aria-label="#${no} sorumlusu"><option value="">Atanmadı</option>${D.ekip.map(e => `<option value="${esc(e.ad)}" ${s.sorumlu === e.ad ? "selected" : ""}>${esc(e.ad)}</option>`).join("")}</select></td>` : ""}
      <td>${rozet(sipDurum(s), SIP_ET(s))}${s.mesaj ? `<div class="mesaj-gitti">${IK.tik}Gecikme mesajı gitti</div>` : ""}</td>
    </tr>`;
  };
  return `
  <section class="kart">
    <div class="sekme-sira" role="tablist">${SIP_SEKME.map(([id, ad]) => `<button class="sekme" role="tab" data-sip-sekme="${id}" aria-selected="${sipSekme === id}">${ad}<span class="say${id === "gecikti" && say.gecikti ? " kirmizi" : ""} tn">${say[id]}</span></button>`).join("")}</div>
    <div class="eylem-cubugu">
      <span class="bilgi">${secili.size ? `<b class="tn" style="color:var(--yazi)">${secili.size}</b> sipariş seçili` : `Kargo son saati <b class="tn" style="color:var(--yazi)">${pad(D.kargoSaat)}:00</b> · son saate 1 saatten az kala gelen sipariş ertesi gün çıkar`}</span>
      <button class="btn" data-eylem="gecikme" ${secili.size ? "" : "disabled"}>${IK.mesaj}Müşteriye gecikme mesajı</button>
    </div>
    ${gor.length ? `<div class="tablo-kap"><table>
      <thead><tr><th><input type="checkbox" data-sec-hepsi ${hepsiSecili ? "checked" : ""} ${sec.length ? "" : "disabled"} aria-label="Tümünü seç"></th>${th("no","Sipariş")}${th("kanal","Kanal")}${th("urun","Ürün")}${th("musteri","Müşteri")}${th("tutar","Tutar","sayi")}${th("kalan","Son kargolamaya")}<th>Kargo</th>${D.ekip.length ? th("sorumlu","Sorumlu") : ""}${th("durum","Durum")}</tr></thead>
      <tbody>${gor.map(satir).join("")}</tbody></table></div>` : `<p class="bos">${arama || kanalF ? "Bu filtreyle eşleşen sipariş yok." : sipListe().length ? "Bu sekmede sipariş yok." : "Henüz sipariş gelmedi."}</p>`}
  </section>`;
}

/* ---------- iadeler ---------- */
const IADE_SUTUN = [["Created","Talep geldi"],["Accepted","Onaylandı · ödeme bekliyor"],["Refunded","Para iade edildi"],["Rejected","Reddedildi"]];
function cizIadeler(){
  const ls = iadeListe().filter(iadeEsle);
  const kart = r => {
    const d = iadeDurum(r), acik = iadeAcikMi(r), g = iadeGun(r), kalan = D.iadeSinir - g, id = esc(r.claimId);
    const kalEt = !acik ? (r.status === "Refunded" ? `${IK.yesil}${g + 1}. günde ödendi` : `${IK.gri}Kapandı`) : kalan > 1 ? `${IK[d]}${kalan} gün kaldı` : kalan === 1 ? `${IK.kirmizi}Son gün` : `${IK.kirmizi}${-kalan + 1} gün aşıldı`;
    const doluluk = Math.min(100, Math.max(2, (simdi() - r.claimDate) / (D.iadeSinir*GUN) * 100));
    const esik = iadeEsik();
    return `<article class="iade-kart s-${d}${yeniKart === r.claimId ? " yeni" : ""}" data-iade="${id}">
      <div class="ik-ust"><span class="rno">${id}</span>${kanal(r.kanal)}</div>
      <div class="ik-urun">${esc(r.items[0].productName)}</div>
      <div class="ik-bilgi"><span><b>${tl(r.totalAmount)}</b></span><span>${esc(r.customerName)}</span></div>
      <div class="ik-bilgi"><span>Neden <b>${esc(r.reason)}</b></span><span class="tn">#${esc(r.orderNumber)}</span></div>
      ${r.status === "Rejected" ? `<div class="ik-red">Red gerekçesi: ${esc(r.rejectReason)}</div>` : ""}
      ${acik ? `<div class="sinir" data-sinir>
        <div class="et"><span>Ödeme sınırı</span><b>${Math.min(g, 99)}/${D.iadeSinir} gün</b></div>
        <div class="bar" role="img" aria-label="Ödeme sınırının ${g}. günü, sınır ${D.iadeSinir} gün"><span style="width:${doluluk.toFixed(1)}%"></span><i style="left:${(esik.sari/D.iadeSinir*100).toFixed(1)}%"></i><i style="left:${(esik.kirmizi/D.iadeSinir*100).toFixed(1)}%"></i></div>
        <span class="kal">${kalEt}</span>
      </div>` : `<span class="kal">${kalEt}</span>`}
      <div class="ik-eylem">
        ${r.status === "Created" ? `<div class="ikili"><button class="btn kucuk birincil" data-eylem="iade-onay" data-id="${id}">Onayla</button><button class="btn kucuk" data-eylem="iade-red" data-id="${id}">Reddet</button></div>` : ""}
        ${r.status === "Accepted" ? `<button class="btn kucuk birincil" data-eylem="iade-ode" data-id="${id}">Para iadesini işle ${IK.ok}</button>` : ""}
        <button class="btn kucuk" data-eylem="baglanti" data-id="${id}">${IK.baglanti}Durum bağlantısı</button>
      </div>
    </article>`;
  };
  const sutun = ([st, ad], i) => {
    const ic = ls.filter(r => r.status === st).sort((a,b) => st === "Created" || st === "Accepted" ? a.claimDate - b.claimDate : (b.closedDate || 0) - (a.closedDate || 0));
    return `<div class="sutun" data-sutun="${st}"><div class="sutun-bas"><span class="no tn">${i + 1}</span><span>${esc(ad)}</span><span class="say tn">${ic.length}</span></div>${ic.map(kart).join("") || `<p class="bos" style="padding:16px 6px;font-size:13px">Boş</p>`}</div>`;
  };
  return `
  <p class="not">${IK.bilgi}<span>Süre, müşterinin iade talebinden itibaren sayılır. Ödeme sınırı: <b>${D.iadeSinir} gün</b> · sınırın %70'inde sarı, son gün kırmızı. <b>Onaylayınca ürün stoğa geri eklenir.</b></span></p>
  <div class="kanban-kap" data-kanban><div class="kanban">${IADE_SUTUN.map(sutun).join("")}</div></div>`;
}

/* ---------- stok ---------- */
function cizStok(){
  const ls = D.urunler.filter(p => !arama || [p.ad, p.sku, p.kat, uyumMetin(p)].join(" ").toLocaleLowerCase("tr").includes(arama));
  const tukendi = D.urunler.filter(p => stokDurum(p) === "kirmizi").length, az = D.urunler.filter(p => stokDurum(p) === "sari").length;
  const deger = D.urunler.reduce((a, p) => a + p.stok*p.fiyat, 0), adet = D.urunler.reduce((a, p) => a + p.stok, 0);
  const secenek = p => p.uyum.length ? "Uyum: " + uyumMetin(p) : p.vt ? `${p.vt === "numara" ? "Numara" : "Beden"} ${VARYANT[p.vt][0]}–${VARYANT[p.vt][VARYANT[p.vt].length - 1]}` : "Tek seçenek";
  return `
  <div class="kpi-sira">
    <div class="kpi"><span class="et">${IK.stok}Ürün</span><span class="deger">${D.urunler.length}</span><span class="alt">${adet} adet stokta</span></div>
    <div class="kpi s-${tukendi ? "kirmizi" : "yesil"}"><span class="et">${IK.kirmizi}Tükendi</span><span class="deger">${tukendi}</span><span class="alt">Stok 0 iken gelen sipariş uyarı verir</span></div>
    <div class="kpi s-${az ? "sari" : "yesil"}"><span class="et">${IK.sari}Azaldı</span><span class="deger">${az}</span><span class="alt">Eşik: ${D.stokEsik} adet ve altı</span></div>
    <div class="kpi"><span class="et">${IK.siparisler}Stok değeri</span><span class="deger tn" style="font-size:30px">${Math.round(deger/1000).toLocaleString("tr-TR")} bin TL</span><span class="alt">Satış fiyatıyla</span></div>
  </div>
  <section class="kart">
    <div class="kart-bas"><div><h2>Ürünler</h2><p>Stok, siparişle düşer; onaylanan iadeyle geri eklenir. Sayıyı değiştirip Enter'a bas ya da kutudan çık.</p></div>
      <label class="esik-et" for="stok-esik">Azalan stok eşiği <input type="number" id="stok-esik" min="0" max="99" value="${D.stokEsik}"> adet</label></div>
    ${ls.length ? `<div class="tablo-kap"><table>
      <thead><tr><th>Stok kodu</th><th>Ürün</th><th>Kategori</th><th class="sayi">Fiyat</th><th>Stok</th><th>Durum</th></tr></thead>
      <tbody>${ls.map(p => `<tr data-urun="${esc(p.sku)}"><td class="tn hucre-ana">${esc(p.sku)}</td><td class="sar"><div class="hucre-ana">${esc(p.ad)}</div><div class="hucre-alt">${esc(secenek(p))}</div></td><td>${esc(p.kat)}</td><td class="tn sayi">${tl(p.fiyat)}</td><td><input type="number" class="stok-gir tn" id="st-${esc(p.sku)}" data-stok="${esc(p.sku)}" min="0" max="9999" step="1" value="${p.stok}" aria-label="${esc(p.ad)} stoğu"></td><td>${rozet(stokDurum(p), STOK_ET[stokDurum(p)])}</td></tr>`).join("")}</tbody></table></div>`
    : `<p class="bos">Bu aramayla eşleşen ürün yok.</p>`}
  </section>`;
}

/* ---------- ayarlar ---------- */
const sec = (ad, deger, secenekler) => `<div class="secim" role="group">${secenekler.map(([v, et]) => `<button type="button" id="ay-${ad}-${v}" data-ayar="${ad}" data-v="${v}" aria-pressed="${String(deger) === String(v)}">${et}</button>`).join("")}</div>`;

    <div class="f-satir"><span class="lbl">Müşteriye hitap</span>${sec("hitap", D.hitap, [["siz","Siz"],["sen","Sen"]])}<span class="yardim">Taslak cevaplar ve müşteri mesajları bu dille yazılır.</span></div>

    <div class="f-satir"><span class="lbl">Mesaj cevap hedefi</span>${sec("mhedef", D.mesajHedefDk, [[15,"15 dk"],[30,"30 dk"],[60,"1 sa"]])}<span class="yardim">WhatsApp ve Instagram mesajları için.</span></div>
    <div class="f-satir"><label for="ay-kargo">Kargo son saati</label><select id="ay-kargo" style="max-width:160px">${[12,13,14,15,16,17,18].map(h => `<option value="${h}" ${D.kargoSaat === h ? "selected" : ""}>${pad(h)}:00</option>`).join("")}</select><span class="yardim">Son saate 1 saatten az kala gelen sipariş ertesi gün çıkmalı sayılır.</span></div>

}
function ayarStok(){

    <div class="f-satir"><label for="ay-esik">Azalan stok eşiği</label><input type="number" id="ay-esik" min="0" max="99" value="${D.stokEsik}" style="max-width:120px"><span class="yardim">Stok bu sayıya ya da altına inince sarı uyarı çıkar; 0'da kırmızı.</span></div>
  </div>`;
}
function ayarEkip(){
  return `<div class="f-bolum"><h3>Ekip <span class="soluk" style="text-transform:none;letter-spacing:0;font-weight:600">· isteğe bağlı</span></h3>
    ${D.ekip.length ? `<div class="ekip">${D.ekip.map((e, i) => `<div class="ekip-satir"><b>${esc(e.ad)}</b><span class="rol">${esc(e.rol)}</span><button type="button" class="sil" data-eylem="ekip-sil" data-i="${i}" aria-label="${esc(e.ad)} kişisini çıkar">Çıkar</button></div>`).join("")}</div>` : `<span class="yardim soluk" style="font-size:12.5px">Ekip eklersen siparişlere sorumlu atayabilirsin. Tek başına çalışıyorsan boş bırak.</span>`}
    <form class="ekip-ekle" id="ekip-form">
      <input type="text" id="ekip-ad" placeholder="Ad" aria-label="Ad" maxlength="20" autocomplete="off">
      <select id="ekip-rol" aria-label="Rol">${ROLLER.map(r => `<option>${r}</option>`).join("")}</select>
      <button class="btn" type="submit">Ekle</button>
    </form>

}
function cizAyarlar(){
  const bk = bagliKanallar();
  return `
  <div class="ayar-izgara">
    <section class="kart form" aria-label="Ayarlar formu">
      <div class="f-bolum"><h3>Mağaza</h3>
        <div class="f-satir"><label for="ay-ad">Mağaza adı</label><input type="text" id="ay-ad" value="${esc(D.magaza.ad)}" maxlength="40" autocomplete="off"></div>
        <div class="f-satir"><label for="ay-ne">Ne satıyorsun?</label><input type="text" id="ay-ne" value="${esc(D.magaza.ne)}" maxlength="80" autocomplete="off" placeholder="ör. motosiklet ekipmanı ve yedek parça"></div>
        <div class="f-satir"><label for="ay-yetkili">Yetkili adı</label><input type="text" id="ay-yetkili" value="${esc(D.magaza.yetkili)}" maxlength="40" autocomplete="off" placeholder="İsteğe bağlı"></div>

      ${KANAL_SIRA.map(kanalKart).join("")}

}

/* ================= katman (yan panel / pencere) ================= */
let perde = null;
function katmanAc(tur, baslik, govde, alt){
  katmanKapat(true);
  perde = document.createElement("div");
  perde.className = "perde " + tur; perde.dataset.eylem = "perde";
  perde.innerHTML = `<div class="panel" role="dialog" aria-modal="true" aria-label="${baslik}"><div class="panel-bas"><h3>${baslik}</h3><button class="kapat" data-eylem="kapat" aria-label="Kapat">×</button></div><div class="panel-govde">${govde}</div>${alt ? `<div class="panel-alt">${alt}</div>` : ""}</div>`;
  document.body.appendChild(perde);
  requestAnimationFrame(() => perde && perde.classList.add("acik"));
  const k = perde.querySelector(".kapat"); if(k) k.focus({preventScroll:true});
}
function katmanKapat(hemen){
  if(!perde) return;
  const p = perde; perde = null;
  if(hemen){ p.remove(); return; }
  p.classList.remove("acik"); setTimeout(() => p.remove(), 220);
}
function gecikmeMetni(s){
  return sablon(`Merhaba {ad}, #${s.orderNumber} numaralı [siparişiniz|siparişin] beklenenden geç hazırlandı, özür dileriz. Bugün {kesim} kadar kargoya verilecek; takip numarası gelince hemen ileteceğiz. [Anlayışınız|Anlayışın] için teşekkürler. {marka}`, s);
}
function gecikmeAc(){
  const ls = D.siparisler.filter(s => secili.has(s.orderNumber)); if(!ls.length) return;
  const yer = s => s.kanal === "site" ? "SMS" : s.kanal === "whatsapp" ? "WhatsApp" : s.kanal === "instagram" ? "Instagram DM" : KANAL[s.kanal] + " mesajı";
  const govde = `<p class="soluk" style="margin:0">${ls.length} müşteriye hazır gecikme bildirimi. Hitap: ${D.hitap === "siz" ? "Siz" : "Sen"}.</p>
    ${ls.map((s, i) => `<div class="taslak"><div class="taslak-ust"><b class="tn">#${esc(s.orderNumber)} · ${esc(s.customerName)}</b><span>Gidecek yer: ${yer(s)}</span></div><textarea class="gecikme-metin" id="gm-${i}" rows="4" aria-label="#${esc(s.orderNumber)} mesajı">${esc(gecikmeMetni(s))}</textarea></div>`).join("")}
    <p class="onay-notu">${IK.kilit}<span>Mesaj ancak sen onaylayınca gider. Deneme mağazasında hiçbir mesaj gerçekten gönderilmez.</span></p>`;
  katmanAc("yan", "Müşteriye gecikme mesajı", govde, `<button class="btn" data-eylem="kapat">Vazgeç</button><button class="btn birincil" data-eylem="gecikme-gonder">${IK.tik.replace('viewBox','width="14" height="14" viewBox')}Onayla ve gönder (${ls.length})</button>`);
}
function kargoAc(no){
  const s = D.siparisler.find(x => x.orderNumber === no); if(!s || s.status === "Shipped") return;
  const vars = s.kanal === "trendyol" ? "Trendyol Express" : s.kanal === "hepsiburada" ? "HepsiJet" : "Yurtiçi Kargo";
  katmanAc("yan", `Kargoya ver · #${esc(no)}`, `
    <div class="baglam"><div><small>Müşteri</small>${esc(s.customerName)}</div><div><small>Kanal</small>${kanal(s.kanal)}</div><div><small>Paket no</small><span class="tn">${esc(s.shipmentPackageId)}</span></div><div><small>Son kargolama</small><span class="tn">${tarihSaat(s.agreedDeliveryDate)}</span></div>${s.odeme ? `<div><small>Ödeme</small>${esc(s.odeme)}</div>` : ""}</div>
    <div class="kalemler">${s.lines.map(l => `<div class="kalem"><div><b>${esc(l.productName)}</b><div class="hucre-alt tn">${esc(l.merchantSku)} · ${l.quantity} adet${l.stokYok ? ` · <span style="color:var(--kirmizi);font-weight:700">stokta yoktu</span>` : ""}</div></div><span class="tn">${tl(l.price*l.quantity)}</span></div>`).join("")}<div class="kalem toplam"><b>Toplam</b><b class="tn">${tl(s.totalPrice)}</b></div></div>
    <form id="kargo-form" data-no="${esc(no)}" class="kk-form" novalidate>
      <label class="kk-alan"><span>Kargo firması</span><select id="kargo-firma">${KARGO_FIRMA.map(f => `<option ${f === vars ? "selected" : ""}>${f}</option>`).join("")}</select></label>
      <label class="kk-alan"><span>Takip no</span><input type="text" id="kargo-takip" placeholder="Kargo fişindeki takip numarası" autocomplete="off" maxlength="30"></label>
      <p class="kk-hata" id="kargo-hata" hidden></p>

  kaydet();
  const ae = document.activeElement;
  const yaziyor = ae && /^(TEXTAREA|INPUT|SELECT)$/.test(ae.tagName) && ae.id !== "arama";
  const yenile = () => { if(!perde && !yaziyor && sayfa !== "ayarlar") ciz(); else { menuCiz(); tik(); } };
  if(olaylar.length){
    yenile();
    const o = olaylar[olaylar.length - 1];
    bildir(olaylar.length > 1 ? `${olaylar.length} yeni iş · son: ${o.metin}` : o.metin);
    const u = olaylar.find(x => x.uyari); if(u) setTimeout(() => bildir(u.uyari, "kirmizi"), 2700);
    return;
  }
  tik();
  const i = imza();
  if(i !== sonImza){ sonImza = i; yenile(); }
}, 1000);

/* ================= başlangıç ve hash ================= */
function hashOku(){
  const h = decodeURIComponent(location.hash.replace("#",""));
  if(D.kurulum.tamam && SAYFALAR.some(x => x[0] === h)){ sayfayaGit(h); return true; }
  return false;
}
addEventListener("hashchange", hashOku);
durumYukle();
if(!hashOku()) ciz();
sonImza = imza();
})();
</script>
