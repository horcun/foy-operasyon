<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Föy Operasyon</title>
<meta name="description" content="Süresi kaçan soru, sipariş ve iadeyi önceden gösteren işletme paneli. Prototip, örnek veri.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f2a26">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --zemin:#F3F1ED; --kenar:#FAF8F5; --kart:#FFFFFF; --yuzey:#F7F5F1; --cizgi:#E2DDD4; --cizgi-a:#ECE8E1;
  --yazi:#1E1C19; --soluk:#665F56; --golge:0 1px 2px rgba(40,30,20,.05), 0 2px 8px -4px rgba(40,30,20,.08);
  --kirmizi:#B42318; --kirmizi-zemin:#FDEBEA; --sari:#8A5A00; --sari-zemin:#FFF2CF; --sari-cizgi:#E2A400;
  --yesil:#17663B; --yesil-zemin:#E2F3E8; --balon:#1E1C19; --balon-yazi:#FFFFFF;
  --marka-a:#9E2A4B; --marka-k:#F07A9B; --marka:var(--marka-a); --marka-on:#FFFFFF;
  --marka-zemin:color-mix(in srgb, var(--marka) 9%, var(--kart));
  --marka-orta:color-mix(in srgb, var(--marka) 55%, var(--kart));
  --marka-acik:color-mix(in srgb, var(--marka) 28%, var(--kart));
  --f-baslik:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-govde:"Figtree", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --hiz:200ms; --kenar-g:244px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --zemin:#121110; --kenar:#171614; --kart:#1F1E1B; --yuzey:#191816; --cizgi:#36322C; --cizgi-a:#2A2723;
  --yazi:#EEEBE6; --soluk:#A8A197; --golge:0 1px 2px rgba(0,0,0,.4);
  --kirmizi:#FF7A70; --kirmizi-zemin:#3A1714; --sari:#F2BE55; --sari-zemin:#352A10; --sari-cizgi:#C99320;
  --yesil:#62D193; --yesil-zemin:#11301F; --balon:#EEEBE6; --balon-yazi:#121110;
  --marka:var(--marka-k); --marka-on:#121110; color-scheme:dark}}
:root[data-theme="dark"]{
  --zemin:#121110; --kenar:#171614; --kart:#1F1E1B; --yuzey:#191816; --cizgi:#36322C; --cizgi-a:#2A2723;
  --yazi:#EEEBE6; --soluk:#A8A197; --golge:0 1px 2px rgba(0,0,0,.4);
  --kirmizi:#FF7A70; --kirmizi-zemin:#3A1714; --sari:#F2BE55; --sari-zemin:#352A10; --sari-cizgi:#C99320;
  --yesil:#62D193; --yesil-zemin:#11301F; --balon:#EEEBE6; --balon-yazi:#121110;
  --marka:var(--marka-k); --marka-on:#121110; color-scheme:dark}
@media (prefers-reduced-motion: reduce){:root{--hiz:1ms}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--zemin); color:var(--yazi); font-family:var(--f-govde); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--marka); outline-offset:2px}
.tn{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0}
svg{flex:none}

/* ---------- iskelet ---------- */
.uygulama{display:grid; grid-template-columns:var(--kenar-g) minmax(0,1fr); min-height:100vh}
.kenar{position:sticky; top:0; height:100vh; overflow-y:auto; overflow-x:hidden; background:var(--kenar); border-right:1px solid var(--cizgi); display:flex; flex-direction:column; gap:18px; padding:18px 14px 14px}
.logo-satir{display:flex; align-items:center; gap:10px; font-family:var(--f-baslik); font-weight:800; font-size:20px; letter-spacing:-.02em; padding:2px 6px; white-space:nowrap}
.logo-satir svg{width:28px; height:28px; color:var(--yazi)}
.kenar h2{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--soluk); font-weight:700; padding:0 6px; margin-bottom:6px}
.marka-liste{display:flex; flex-direction:column; gap:4px}
.marka-btn{display:flex; align-items:center; gap:10px; padding:7px 8px; border:1px solid transparent; border-radius:10px; background:none; text-align:left; width:100%}
.marka-btn:hover{background:var(--yuzey)}
.marka-btn[aria-pressed="true"]{background:var(--kart); border-color:var(--cizgi); box-shadow:var(--golge)}
.marka-btn .ad{font-weight:600; font-size:14px; line-height:1.2; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.marka-btn small{display:block; color:var(--soluk); font-size:12px; white-space:nowrap}
.mlogo{width:30px; height:30px; flex:none; display:grid; place-items:center; color:#fff; font-family:var(--f-baslik); font-weight:800; font-size:15px}
.mlogo.daire{border-radius:50%} .mlogo.kare{border-radius:8px} .mlogo.yaprak{border-radius:50% 4px 50% 4px}
.menu{display:flex; flex-direction:column; gap:2px}
.menu-btn{display:flex; align-items:center; gap:11px; padding:9px 10px; border:0; border-radius:9px; background:none; font-weight:600; font-size:14px; color:var(--soluk); width:100%; text-align:left; position:relative}
.menu-btn svg{width:20px; height:20px}
.menu-btn:hover{background:var(--yuzey); color:var(--yazi)}
.menu-btn[aria-current="page"]{background:var(--marka-zemin); color:var(--marka)}
.menu-btn[aria-current="page"]::before{content:""; position:absolute; left:-14px; top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0; background:var(--marka)}
.menu-btn .say{margin-left:auto}
.say{min-width:22px; height:20px; padding:0 6px; border-radius:10px; font-size:12px; font-weight:700; line-height:20px; text-align:center; font-variant-numeric:tabular-nums; background:var(--cizgi-a); color:var(--yazi)}
.say.kirmizi{background:var(--kirmizi); color:var(--kart)}
.kenar-alt{margin-top:auto; display:flex; flex-direction:column; gap:10px}
.ornek-not{font-size:12px; color:var(--soluk); border:1px dashed var(--cizgi); border-radius:10px; padding:8px 10px; display:flex; gap:7px; align-items:flex-start}
.ornek-not svg{width:14px; height:14px; margin-top:2px}
.kullanici{display:flex; align-items:center; gap:10px; padding:6px; font-size:13px}
.kullanici small{display:block; color:var(--soluk); font-size:12px}
.avatar{width:32px; height:32px; border-radius:50%; background:var(--cizgi-a); display:grid; place-items:center; font-weight:700; flex:none}

.ana{min-width:0; display:flex; flex-direction:column}
.ust{position:sticky; top:0; z-index:10; background:color-mix(in srgb, var(--zemin) 92%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--cizgi); padding:14px 24px 12px; display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px}
.ust-bas{display:flex; flex-direction:column; min-width:0; margin-right:auto}
.ust-bas h1{font-family:var(--f-baslik); font-weight:800; font-size:24px; letter-spacing:-.02em; line-height:1.1}
.ust-bas .zaman{font-size:13px; color:var(--soluk)}
.ust-sag{display:flex; align-items:center; gap:10px; flex-wrap:wrap; min-width:0}
.arama{position:relative; width:260px; max-width:100%}
.arama svg{position:absolute; left:10px; top:50%; translate:0 -50%; width:16px; height:16px; color:var(--soluk)}
.arama input{width:100%; padding:8px 10px 8px 32px; border:1px solid var(--cizgi); border-radius:9px; background:var(--kart); font-size:14px}
.cipler{display:flex; gap:6px; flex-wrap:wrap}
.cip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--cizgi); background:var(--kart); border-radius:999px; padding:5px 11px; font-size:13px; font-weight:600; color:var(--soluk)}
.cip[aria-pressed="true"]{background:var(--yazi); border-color:var(--yazi); color:var(--kart)}
.ornek-rozet{font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:4px 8px; border:1px dashed var(--soluk); border-radius:6px; color:var(--soluk); white-space:nowrap}
.marka-mobil{display:none}

.sayfa{padding:22px 24px 40px; display:flex; flex-direction:column; gap:20px; min-width:0}
.alt-sekme{display:none}

/* ---------- ortak ---------- */
.kart{background:var(--kart); border:1px solid var(--cizgi); border-radius:14px; box-shadow:var(--golge); min-width:0}
.kart-bas{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px 10px; flex-wrap:wrap}
.kart-bas h2{font-family:var(--f-baslik); font-size:17px; font-weight:700; letter-spacing:-.01em}
.kart-bas p{margin:0; font-size:13px; color:var(--soluk)}
.rozet{display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:700; padding:2px 8px 2px 6px; border-radius:999px; white-space:nowrap; line-height:1.5}
.rozet svg{width:13px; height:13px}
.r-kirmizi{background:var(--kirmizi-zemin); color:var(--kirmizi)}
.r-sari{background:var(--sari-zemin); color:var(--sari)}
.r-yesil{background:var(--yesil-zemin); color:var(--yesil)}
.r-gri{background:var(--cizgi-a); color:var(--soluk)}
.kanal{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:1px 7px; border-radius:5px; border:1px solid var(--cizgi); color:var(--soluk); white-space:nowrap; background:var(--kart)}
.kanal i{width:7px; height:7px; display:inline-block; background:var(--soluk); flex:none}
.kanal.trendyol i{border-radius:1px} .kanal.hepsiburada i{border-radius:50%; background:transparent; border:1.5px solid var(--soluk)}
.kanal.site i{transform:rotate(45deg)} .kanal.whatsapp i{border-radius:50% 50% 50% 0}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--cizgi); background:var(--kart); border-radius:9px; padding:8px 13px; font-size:14px; font-weight:600; white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--yazi)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.birincil{background:var(--marka); border-color:var(--marka); color:var(--marka-on)}
.btn.birincil:hover:not(:disabled){filter:brightness(1.08); border-color:var(--marka)}
.btn.kucuk{padding:5px 9px; font-size:13px}
.btn svg{width:15px; height:15px}
.asim{color:var(--kirmizi); font-weight:700; display:inline-flex; align-items:center; gap:4px; white-space:nowrap}
.asim svg{width:13px; height:13px}
.soluk{color:var(--soluk)}
.not{display:flex; gap:8px; align-items:flex-start; font-size:13px; padding:10px 12px; border-radius:10px; background:var(--marka-zemin); margin:0}
.not svg{width:16px; height:16px; margin-top:1px; color:var(--marka)}
.bos{padding:28px 16px; text-align:center; color:var(--soluk); font-size:14px}
.vurgu{animation:vurgu 1.4s ease-in-out 2}
@keyframes vurgu{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 5px color-mix(in srgb, var(--marka) 45%, transparent)}}
tr.vurgu td{animation:vurgu-td 1.4s ease-in-out 2}
@keyframes vurgu-td{0%,100%{background:transparent}50%{background:color-mix(in srgb, var(--marka) 16%, var(--kart))}}

/* tablo */
.tablo-kap{overflow-x:auto; min-width:0; -webkit-overflow-scrolling:touch}
table{width:100%; border-collapse:collapse; font-size:13.5px}
th{font-size:12px; font-weight:700; color:var(--soluk); text-align:left; padding:9px 9px; border-bottom:1px solid var(--cizgi); white-space:nowrap; background:var(--yuzey)}
td{padding:10px 9px; border-bottom:1px solid var(--cizgi-a); vertical-align:middle; white-space:nowrap}
th:first-child, td:first-child{padding-left:16px} th:last-child, td:last-child{padding-right:16px}
tbody tr:last-child td{border-bottom:0}
tbody tr.tik{cursor:pointer}
tbody tr.tik:hover td, tbody tr.secili td{background:var(--marka-zemin)}
th button{border:0; background:none; padding:0; font:inherit; color:inherit; display:inline-flex; align-items:center; gap:4px}
th button:hover{color:var(--yazi)}
th[aria-sort] button{color:var(--yazi)}
th .ok{font-size:10px}
td.sayi, th.sayi{text-align:right}
.hucre-ana{font-weight:600}
.hucre-alt{font-size:12px; color:var(--soluk)}
.urun-h{max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
td select{padding:5px 6px; border:1px solid var(--cizgi); border-radius:7px; background:var(--kart); font-size:13px; width:auto; min-width:96px}
input[type=checkbox]{width:16px; height:16px; accent-color:var(--marka); margin:0; vertical-align:middle}

/* ---------- genel bakış ---------- */
.kpi-sira{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px}
.kpi{padding:16px 16px 14px; display:flex; flex-direction:column; gap:8px; text-align:left; border:1px solid var(--cizgi); background:var(--kart); border-radius:14px; box-shadow:var(--golge); position:relative; overflow:hidden}
.kpi:hover{border-color:var(--soluk)}
.kpi::after{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--cizgi)}
.kpi.s-kirmizi::after{background:var(--kirmizi)} .kpi.s-sari::after{background:var(--sari-cizgi)} .kpi.s-yesil::after{background:var(--yesil)}
.kpi .et{font-size:13px; font-weight:600; color:var(--soluk); display:flex; align-items:center; gap:7px}
.kpi .et svg{width:17px; height:17px}
.kpi .deger{font-family:var(--f-govde); font-weight:700; font-size:38px; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.kpi .alt{font-size:12.5px; color:var(--soluk); display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.genel-izgara{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:20px; align-items:start}
.sag-sutun{display:flex; flex-direction:column; gap:20px; min-width:0}
.tur-h{display:inline-flex; align-items:center; gap:6px; font-weight:600}
.tur-h svg{width:16px; height:16px; color:var(--soluk)}
.ozet-govde{padding:0 16px 16px; display:flex; flex-direction:column; gap:10px}
.balon-mesaj{background:var(--marka-zemin); border-radius:4px 14px 14px 14px; padding:11px 13px; font-size:13.5px; display:flex; flex-direction:column; gap:4px}
.balon-mesaj .zaman{align-self:flex-end; font-size:11px; color:var(--soluk)}
.ozet-kanal{display:flex; gap:6px; flex-wrap:wrap}
.grafik{padding:2px 16px 16px; display:flex; flex-direction:column; gap:10px}
.g-satir{display:grid; grid-template-columns:96px minmax(0,1fr) 28px; gap:10px; align-items:center; font-size:13px}
.g-cubuk{height:16px; display:flex; background:var(--yuzey); border-radius:4px; overflow:hidden; position:relative}
.g-cubuk span{height:100%}
.g-cubuk span+span{border-left:2px solid var(--kart)}
.g-eksen{display:grid; grid-template-columns:96px minmax(0,1fr) 28px; gap:10px; font-size:11px; color:var(--soluk)}
.g-eksen .olcek{position:relative; height:14px; border-top:1px solid var(--cizgi)}
.g-eksen .olcek span{position:absolute; top:2px; translate:-50% 0; font-variant-numeric:tabular-nums}
.g-eksen .olcek span:first-child{translate:0 0}
.g-eksen .olcek span:last-child{translate:-100% 0}
.lejant{display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--soluk)}
.lejant i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px}
.c1{background:var(--marka)} .c2{background:var(--marka-orta)} .c3{background:var(--marka-acik)}

/* ---------- sorular ---------- */
.gelen{display:grid; grid-template-columns:380px minmax(0,1fr); gap:0; overflow:hidden; min-height:560px}
.gelen-liste{border-right:1px solid var(--cizgi); display:flex; flex-direction:column; min-width:0; max-height:calc(100vh - 160px); overflow-y:auto}
.grup-bas{display:flex; justify-content:space-between; font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--soluk); padding:12px 16px 6px; background:var(--yuzey); border-bottom:1px solid var(--cizgi-a); position:sticky; top:0; z-index:1}
.soru-satir{display:flex; flex-direction:column; gap:5px; padding:12px 16px; border:0; border-bottom:1px solid var(--cizgi-a); background:none; text-align:left; width:100%; position:relative}
.soru-satir:hover{background:var(--yuzey)}
.soru-satir[aria-current="true"]{background:var(--marka-zemin)}
.soru-satir[aria-current="true"]::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--marka)}
.soru-satir .s1{display:flex; align-items:center; gap:8px}
.soru-satir .s1 .m{font-weight:700}
.soru-satir .s1 .bk{margin-left:auto; font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--soluk); white-space:nowrap}
.soru-satir.s-kirmizi .bk{color:var(--kirmizi); font-weight:700}
.soru-satir.s-sari .bk{color:var(--sari); font-weight:700}
.soru-satir .s2{font-size:12.5px; color:var(--soluk); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.soru-satir .s3{font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.soru-satir.cevaplandi{opacity:.65}
.detay{padding:20px 24px 24px; display:flex; flex-direction:column; gap:16px; min-width:0}
.detay-bas{display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap}
.detay-bas h2{font-family:var(--f-baslik); font-size:21px; font-weight:700}
.detay-bas .sag{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.soru-balon{background:var(--yuzey); border:1px solid var(--cizgi-a); border-radius:4px 14px 14px 14px; padding:12px 14px; font-size:15.5px; max-width:640px}
.bekleme{font-size:13px; color:var(--soluk)} .bekleme b{font-size:15px; color:var(--yazi); font-variant-numeric:tabular-nums}
.s-kirmizi .bekleme b{color:var(--kirmizi)} .s-sari .bekleme b{color:var(--sari)}
.baglam{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--cizgi-a); border:1px solid var(--cizgi-a); border-radius:10px; overflow:hidden}
.baglam div{background:var(--kart); padding:9px 12px; font-size:13px; min-width:0}
.baglam small{display:block; font-size:11px; color:var(--soluk); text-transform:uppercase; letter-spacing:.06em; font-weight:700}
.taslak{border:1px solid var(--cizgi); border-radius:12px; overflow:hidden}
.taslak-ust{display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; padding:8px 12px; background:var(--marka-zemin); font-size:12.5px}
.taslak-ust b{color:var(--marka); display:inline-flex; align-items:center; gap:6px}
.taslak-ust b svg{width:14px; height:14px}
textarea{width:100%; border:0; padding:12px; resize:vertical; background:var(--kart); min-height:130px; display:block; font-size:14.5px; line-height:1.5}
textarea.duzenleniyor{background:var(--yuzey); box-shadow:inset 0 0 0 2px var(--marka)}
.onay-notu{display:flex; gap:8px; font-size:13px; margin:0; padding:10px 12px; border-radius:10px; background:var(--yuzey); border:1px solid var(--cizgi-a)}
.onay-notu svg{width:16px; height:16px; margin-top:1px}
.eylemler{display:flex; gap:8px; flex-wrap:wrap}
.eylemler .btn.birincil{padding:9px 18px}

/* ---------- siparişler ---------- */
.sekme-sira{display:flex; gap:4px; border-bottom:1px solid var(--cizgi); padding:0 16px; overflow-x:auto}
.sekme{border:0; background:none; padding:12px 12px 10px; font-weight:600; font-size:14px; color:var(--soluk); border-bottom:2px solid transparent; margin-bottom:-1px; display:inline-flex; gap:7px; align-items:center; white-space:nowrap}
.sekme[aria-selected="true"]{color:var(--yazi); border-bottom-color:var(--marka)}
.eylem-cubugu{display:flex; align-items:center; gap:12px; padding:10px 16px; flex-wrap:wrap; border-bottom:1px solid var(--cizgi-a)}
.eylem-cubugu .bilgi{font-size:13px; color:var(--soluk); margin-right:auto}
.takip-eksik{color:var(--sari); font-weight:700; display:inline-flex; gap:4px; align-items:center; white-space:nowrap}
.takip-eksik svg{width:13px; height:13px}
.mesaj-gitti{font-size:12px; color:var(--yesil); display:flex; align-items:center; gap:3px; margin-top:3px; white-space:nowrap}
.mesaj-gitti svg{width:11px; height:11px}

/* ---------- iadeler ---------- */

.sinir .et b{font-variant-numeric:tabular-nums; color:var(--yazi)}
.s-kirmizi .sinir .kal{color:var(--kirmizi); font-weight:700}
.s-sari .sinir .kal{color:var(--sari); font-weight:700}
.s-yesil .sinir .kal{color:var(--yesil); font-weight:700}
.kal{display:inline-flex; gap:4px; align-items:center; font-size:12.5px}

/* ================= zaman (demo saati) ================= */
let SAPMA = 0;
(function(){
  const d = new Date(), dk = d.getHours()*60 + d.getMinutes();
  if(dk < 9*60 || dk > 13*60+30){ const h = new Date(d); h.setHours(12,46,0,0); SAPMA = h - d; }
})();
const simdi = () => Date.now() + SAPMA;
const pad = n => String(n).padStart(2,"0");
const EK = {9:"a",10:"a",11:"e",12:"ye",13:"e",14:"e",15:"e",16:"ya",17:"ye",18:"e",19:"a",20:"ye"};
const saatYe = h => `${pad(h)}:00'${EK[h]||"e"}`;
function sure(ms){
  ms = Math.max(0, ms); const t = Math.floor(ms/1000);
  const g = Math.floor(t/86400), s = Math.floor(t%86400/3600), d = Math.floor(t%3600/60), x = t%60;
  if(g > 0) return `${g} gün ${s} sa`;
  if(s > 0) return `${s} sa ${pad(d)} dk`;
  return `${d} dk ${pad(x)} sn`;
}
const AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const GUNLER = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const tarih = ms => { const d = new Date(ms); return `${d.getDate()} ${AYLAR[d.getMonth()]}`; };
const tarihSaat = ms => { const d = new Date(ms); return `${d.getDate()} ${AYLAR[d.getMonth()].slice(0,3)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };

/* ================= durum ================= */
let D = null;
let sayfa = "genel", arama = "", kanalF = null, secSoru = null, sipSekme = "hepsi";
let sirala = {k:"kalan", y:1};
const secili = new Set();
let oturumKapanan = 0, yeniKart = null;

function markaYukle(id){
  const m = MARKALAR[id] || MARKALAR.lal;
  const c = JSON.parse(JSON.stringify(m));
  const n = simdi();
  c.sorular.forEach((q,i) => { q.bas = n - q.dk*DK - (i*13 % 50)*1000; q.durum = q.cevap ? "cevaplandi" : "bekliyor"; q.gonderilen = null; });
  c.siparisler.forEach((s,i) => { s.bas = n - (s.gun||0)*GUN - (3 + i%5)*3600000; s.mesaj = false; });
  c.iadeler.forEach((r,i) => { r.bas = n - r.gun*GUN - (2 + i)*3600000; });
  D = c; secSoru = null; secili.clear(); oturumKapanan = 0; kanalF = null;
  try{ localStorage.setItem("foyop-marka", id); }catch(e){}
  temaUygula();
}
function temaUygula(){
  const r = RENKLER[D.renk] || RENKLER.gul, st = document.documentElement.style;
  st.setProperty("--marka-a", r.a); st.setProperty("--marka-k", r.k);
  document.querySelectorAll(".marka-btn[data-marka]").forEach(b => {
    const m = MARKALAR[b.dataset.marka], ben = m.id === D.id;
    b.setAttribute("aria-pressed", ben);
    const lg = b.querySelector(".mlogo"); lg.style.background = ben ? r.a : RENKLER[m.renk].a; lg.textContent = ben ? harf() : m.harf;
    b.querySelector(".ad").textContent = ben ? (D.ad || "İsimsiz işletme") : m.ad;
  });
  $("#kullanici-alt").textContent = D.ad || "İsimsiz işletme";
  $("#marka-mobil").value = D.id;
}
const harf = () => ((D.ad || "?").trim()[0] || "?").toLocaleUpperCase("tr");

/* metin şablonu: {ad} {marka} {kesim} ve [siz|sen] */
function hitapAd(m, c){ const ilk = m.split(" ")[0]; return D.hitap === "siz" ? `${ilk} ${c === "k" ? "Hanım" : "Bey"}` : ilk; }
function sablon(str, o){
  return str.replace(/\{ad\}/g, hitapAd(o.m, o.c)).replace(/\{marka\}/g, D.ad || "İşletme").replace(/\{kesim\}/g, saatYe(D.kargoSaat))
    .replace(/\[([^|\]]*)\|([^\]]*)\]/g, (_, a, b) => D.hitap === "siz" ? a : b);
}
const esc = s => String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[ch]);
const acik = k => D.kanallar[k];

/* ================= hesaplar ================= */
const soruSon = q => q.bas + D.soruHedefDk*DK;
function soruDurum(q){
  if(q.durum === "cevaplandi") return "yesil";
  const g = simdi() - q.bas, h = D.soruHedefDk*DK;
  return g > h ? "kirmizi" : g > h*0.7 ? "sari" : "yesil";
}
function kesimMs(){ const d = new Date(simdi()); d.setHours(D.kargoSaat,0,0,0); return +d; }
function sipGrup(s){ return s.kargoda ? "yolda" : s.gun >= 2 ? "gecikti" : "bugun"; }
function sipDurum(s){ const g = sipGrup(s); return g === "gecikti" ? "kirmizi" : g === "bugun" ? "sari" : (s.takip ? "yesil" : "sari"); }
const sipSon = s => s.kargoda ? Infinity : kesimMs() - (s.gun >= 2 ? (s.gun-1)*GUN : 0);
function iadeAdim(r){ return r.ag.length - 1; }
function iadeGun(r){ return Math.floor((simdi() - r.bas)/GUN); }
function iadeBitti(r){ return iadeAdim(r) >= 4; }
const iadeSon = r => r.bas + D.iadeSinir*GUN;
function iadeEsik(){ const n = D.iadeSinir; return {sari: Math.ceil(n*0.7), kirmizi: n-1}; }
function iadeDurum(r){
  if(iadeBitti(r)) return "yesil";
  const g = iadeGun(r), e = iadeEsik();
  return g >= e.kirmizi ? "kirmizi" : g >= e.sari ? "sari" : "yesil";
}
const AGIRLIK = {kirmizi:2, sari:1, yesil:0};
const enKotu = arr => arr.reduce((a,b) => AGIRLIK[b] > AGIRLIK[a] ? b : a, "yesil");
const kisiRol = rol => D.ekip.find(e => e.rol === rol) || D.ekip[0];

const soruListe = () => D.sorular.filter(q => acik(q.k));
const sipListe = () => D.siparisler.filter(s => acik(s.k));
const iadeListe = () => D.iadeler.filter(r => acik(r.k));
const acikSorular = () => soruListe().filter(q => q.durum !== "cevaplandi").sort((a,b) => a.bas - b.bas);
const acikSip = () => sipListe().filter(s => !s.kargoda);
const acikIade = () => iadeListe().filter(r => !iadeBitti(r));
function filtre(o){
  if(kanalF && o.k !== kanalF) return false;
  if(!arama) return true;
  return [o.m, o.u, o.no || "", KANAL[o.k]].join(" ").toLocaleLowerCase("tr").includes(arama);
}
const kapananSay = () => soruListe().filter(q => q.durum === "cevaplandi").length + iadeListe().filter(iadeBitti).length
  + sipListe().filter(s => s.kargoda && s.takip).length + sipListe().filter(s => s.mesaj).length;

/* ================= ikonlar ================= */
const IK = {
  kirmizi:`<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 15 14H1z" fill="currentColor"/><path d="M8 6v3.6M8 11.4v.1" stroke="var(--kart)" stroke-width="1.8" stroke-linecap="round"/></svg>`,

  kilit:`<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5.3 7V5a2.7 2.7 0 0 1 5.4 0v2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`,
  bilgi:`<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 7v4.5M8 4.6v.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  yildiz:`<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 9.6 6.4 14.5 8 9.6 9.6 8 14.5 6.4 9.6 1.5 8 6.4 6.4z" fill="currentColor"/></svg>`,
  ok:`<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  baglanti:`<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 9.5 9.5 6.5M7 4.5l1.2-1.2a2.8 2.8 0 0 1 4 4L11 8.5M9 11.5l-1.2 1.2a2.8 2.8 0 0 1-4-4L5 7.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  mesaj:`<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12v8H6l-4 3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>`,
  genel:`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13.5" y="11.5" width="7" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3.5" y="14.5" width="7" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>`,
  sorular:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`,
  siparisler:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z M3.5 7.5 12 12l8.5-4.5M12 12v9" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`,

  saat:`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3.5 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`
};
const rozet = (d, metin) => `<span class="rozet r-${d}">${IK[d]}${esc(metin)}</span>`;
const kanal = k => `<span class="kanal ${k}"><i></i>${KANAL[k]}</span>`;
const SOR_ET = {kirmizi:"Hedef aşıldı", sari:"Hedefe yakın", yesil:"Süre içinde"};
const SIP_ET = s => { const g = sipGrup(s); return g === "gecikti" ? "Gecikti" : g === "bugun" ? "Bugün çıkmalı" : (s.takip ? "Yolda" : "Takip no eksik"); };
const IADE_ET = r => iadeBitti(r) ? "Tamamlandı" : {kirmizi:"Sınırda", sari:"Sınıra yakın", yesil:"Süre içinde"}[iadeDurum(r)];
function kalanHtml(hedef){
  const ms = hedef - simdi();
  return ms <= 0 ? `<span class="asim">${IK.kirmizi}${sure(-ms)} aşıldı</span>` : sure(ms);
}

/* ================= çizim ================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const sayfaEl = $("#sayfa");
const SAYFALAR = [["genel","Genel bakış"],["sorular","Sorular"],["siparisler","Siparişler"],["iadeler","İadeler"],["ayarlar","Ayarlar"]];

function rozetSay(){
  const qs = acikSorular(), ss = acikSip(), rs = acikIade();
  return {
    sorular:[qs.length, qs.some(q => soruDurum(q) === "kirmizi")],
    siparisler:[ss.length, ss.some(s => sipDurum(s) === "kirmizi")],
    iadeler:[rs.length, rs.some(r => iadeDurum(r) === "kirmizi")]
  };
}
function menuCiz(){
  const k = rozetSay();
  $("#menu").innerHTML = SAYFALAR.map(([id, ad]) => {
    const r = k[id];
    return `<button class="menu-btn" data-sayfa="${id}" ${sayfa === id ? 'aria-current="page"' : ""} title="${ad}">${IK[id]}<span class="metin">${ad}</span>${r ? `<span class="say${r[1] ? " kirmizi" : ""} tn" aria-label="${r[0]} açık">${r[0]}</span>${r[1] ? `<span class="nokta-say" aria-hidden="true"></span>` : ""}` : ""}</button>`;
  }).join("");
  $("#alt-sekme").innerHTML = SAYFALAR.map(([id, ad]) => {
    const r = k[id];
    return `<button class="alt-btn" data-sayfa="${id}" ${sayfa === id ? 'aria-current="page"' : ""}>${IK[id]}${id === "genel" ? "Genel" : ad}${r && r[0] ? `<span class="say${r[1] ? " kirmizi" : ""} tn">${r[0]}</span>` : ""}</button>`;
  }).join("");
}
function ciplerCiz(){
  const ac = KANAL_SIRA.filter(acik);
  if(kanalF && !acik(kanalF)) kanalF = null;
  $("#cipler").innerHTML = `<button class="cip" data-kanal="" aria-pressed="${!kanalF}">Tümü</button>` +
    ac.map(k => `<button class="cip" data-kanal="${k}" aria-pressed="${kanalF === k}">${KANAL[k]}</button>`).join("");
  $("#cipler").hidden = sayfa === "ayarlar";
  $(".arama").hidden = sayfa === "ayarlar";
}
function ciz(){
  menuCiz(); ciplerCiz();
  $("#baslik").textContent = SAYFALAR.find(x => x[0] === sayfa)[1];
  const f = {genel:cizGenel, sorular:cizSorular, siparisler:cizSiparisler, iadeler:cizIadeler, ayarlar:cizAyarlar}[sayfa];
  const odak = document.activeElement && document.activeElement.id;
  sayfaEl.innerHTML = f();
  if(odak && odak !== "arama"){ const e = document.getElementById(odak); if(e && sayfaEl.contains(e)) e.focus({preventScroll:true}); }
  yeniKart = null;
  tik();
}
function sayfayaGit(id){
  if(!SAYFALAR.some(x => x[0] === id)) return;
  katmanKapat(true);
  sayfa = id; window.scrollTo(0,0); ciz();
}

/* ---------- genel bakış ---------- */
function cizGenel(){
  const qs = acikSorular(), ss = acikSip(), rs = acikIade();
  const qk = qs.filter(q => soruDurum(q) === "kirmizi").length;
  const sk = ss.filter(s => sipGrup(s) === "gecikti").length;
  const rk = rs.filter(r => iadeDurum(r) !== "yesil").length;
  const kap = kapananSay();
  const kpi = (id, ikon, ad, deger, dur, alt) =>
    `<button class="kpi s-${dur}" data-sayfa="${id}" data-kpi="${id}"><span class="et">${IK[ikon]}${ad}</span><span class="deger">${deger}</span><span class="alt">${alt}</span></button>`;
  const now = simdi();
  /* birleşik tablo */
  const satir = [];
  qs.forEach(q => satir.push({tur:"Soru", ikon:"sorular", ref:q.konu, alt:q.u, m:q.m, k:q.k, u:q.u, son:soruSon(q), kisi:kisiRol("Müşteri hizmetleri"), d:soruDurum(q), et:SOR_ET[soruDurum(q)], git:"sorular", id:q.id}));
  ss.forEach(s => satir.push({tur:"Sipariş", ikon:"siparisler", ref:"#"+s.no, alt:s.u, m:s.m, k:s.k, u:s.u, no:s.no, son:sipSon(s), kisi:D.ekip.find(e => e.ad === s.sorumlu), d:sipDurum(s), et:SIP_ET(s), git:"siparisler", id:s.no}));
  rs.filter(r => iadeSon(r) - now <= GUN).forEach(r => satir.push({tur:"İade", ikon:"iadeler", ref:r.no, alt:r.u, m:r.m, k:r.k, u:r.u, no:r.no, son:iadeSon(r), kisi:kisiRol(ADIM_ROL[iadeAdim(r)+1]), d:iadeDurum(r), et:IADE_ET(r), git:"iadeler", id:r.no}));
  const gor = satir.filter(filtre).sort((a,b) => a.son - b.son);
  const tablo = gor.length ? `<div class="tablo-kap"><table>
    <thead><tr><th>Tür</th><th>Kayıt</th><th>Müşteri</th><th>Kanal</th><th>Kalan süre</th><th>Sorumlu</th><th>Durum</th></tr></thead>
    <tbody>${gor.map(x => `<tr class="tik" data-git-sayfa="${x.git}" data-git-id="${esc(x.id)}">
      <td><span class="tur-h">${IK[x.ikon]}${x.tur}</span></td>
      <td><div class="hucre-ana tn">${esc(x.ref)}</div><div class="hucre-alt urun-h">${esc(x.alt)}</div></td>
      <td>${esc(x.m)}</td><td>${kanal(x.k)}</td>
      <td class="tn"><b class="canli" data-hedef="${x.son}">${kalanHtml(x.son)}</b></td>
      <td>${x.kisi ? esc(x.kisi.ad) : `<span class="soluk">Atanmadı</span>`}</td>
      <td>${rozet(x.d, x.et)}</td></tr>`).join("")}</tbody></table></div>`
    : `<p class="bos">${arama || kanalF ? "Bu filtreyle eşleşen iş yok." : "Bugün süresi dolacak iş yok."}</p>`;
  /* kanal dağılımı */
  const ac = KANAL_SIRA.filter(acik);
  const veri = ac.map(k => ({k, q:qs.filter(x => x.k === k).length, s:ss.filter(x => x.k === k).length, r:rs.filter(x => x.k === k).length}));
  const enCok = Math.max(1, ...veri.map(v => v.q + v.s + v.r));
  const adim = enCok <= 5 ? 1 : enCok <= 10 ? 2 : enCok <= 25 ? 5 : 10;
  const ust = Math.ceil(enCok/adim)*adim;
  const isaret = []; for(let v = 0; v <= ust; v += adim) isaret.push(v);
  const yuzde = v => (v/ust*100).toFixed(2) + "%";
  const grafik = veri.map(v => `<div class="g-satir"><span>${KANAL[v.k]}</span>
      <span class="g-cubuk" role="img" aria-label="${KANAL[v.k]}: ${v.q} soru, ${v.s} sipariş, ${v.r} iade">${v.q ? `<span class="c1" style="width:${yuzde(v.q)}"></span>` : ""}${v.s ? `<span class="c2" style="width:${yuzde(v.s)}"></span>` : ""}${v.r ? `<span class="c3" style="width:${yuzde(v.r)}"></span>` : ""}</span>
      <b class="tn">${v.q + v.s + v.r}</b></div>`).join("");
  const d = new Date(now);
  return `
  ${D.not ? `<p class="not">${IK.bilgi}<span>${esc(D.not)}</span></p>` : ""}
  <div class="kpi-sira" data-kpi-sira>
    ${kpi("sorular","sorular","Bekleyen soru", qs.length, qk ? "kirmizi" : qs.length ? "sari" : "yesil", qk ? rozet("kirmizi", `${qk} hedefi aşan`) : rozet("yesil","Hepsi süre içinde"))}
    ${kpi("siparisler","siparisler","Kargolanmamış sipariş", ss.length, sk ? "kirmizi" : ss.length ? "sari" : "yesil", sk ? rozet("kirmizi", `${sk} geciken`) : rozet("yesil","Gecikme yok"))}
    ${kpi("iadeler","iadeler","Açık iade", rs.length, enKotu(rs.map(iadeDurum)), rk ? rozet(enKotu(rs.map(iadeDurum)), `${rk} sınıra yakın`) : rozet("yesil","Süre içinde"))}
    <div class="kpi s-yesil" data-kpi="kapanan"><span class="et">${IK.yesil.replace('fill="currentColor"','fill="none" stroke="currentColor" stroke-width="1.6"').replace('stroke="var(--kart)"','stroke="currentColor"')}Bugün kapatılan iş</span><span class="deger">${kap}</span><span class="alt">${oturumKapanan ? rozet("yesil", `+${oturumKapanan} bu oturumda`) : "Cevap, kargo, iade ve haber"}</span></div>
  </div>
  <div class="genel-izgara">
    <section class="kart" data-tablo aria-labelledby="t-bas">
      <div class="kart-bas"><div><h2 id="t-bas">Bugün süresi dolacaklar</h2><p>Soru, sipariş ve iade tek listede; süresi en az kalan en üstte.</p></div><span class="rozet r-gri tn">${gor.length} iş</span></div>
      ${tablo}
    </section>
    <div class="sag-sutun">
      <section class="kart" data-ozet aria-labelledby="o-bas">
        <div class="kart-bas"><div><h2 id="o-bas">Sabah özeti</h2><p>Her sabah 08:30'da telefona gelir</p></div><span class="ozet-kanal"><span class="kanal whatsapp"><i></i>WhatsApp</span><span class="kanal"><i style="border-radius:50%"></i>Telegram</span></span></div>
        <div class="ozet-govde">
          <div class="balon-mesaj">
            <span>Günaydın, ${esc(D.ad)}. Bugün ${tarih(now)} ${GUNLER[d.getDay()]}.</span>
            <span>Sorular: ${qs.length} bekliyor · hedefi aşan: ${qk}</span>
            <span>Siparişler: ${ss.filter(s => sipGrup(s) === "bugun").length} sipariş ${saatYe(D.kargoSaat)} kadar çıkmalı · geciken: ${sk}</span>
            <span>İadeler: ödeme sınırına 4 gün ya da daha az kalan: ${rs.filter(r => D.iadeSinir - iadeGun(r) <= 4).length}</span>
            <span class="zaman tn">08:30 ✓✓</span>
          </div>
        </div>
      </section>
      <section class="kart" data-grafik aria-labelledby="g-bas">
        <div class="kart-bas"><div><h2 id="g-bas">Kanal dağılımı</h2><p>Açık işler, kanala göre</p></div></div>
        <div class="grafik">
          <div class="lejant"><span><i class="c1"></i>Soru</span><span><i class="c2"></i>Sipariş</span><span><i class="c3"></i>İade</span></div>
          ${grafik}
          <div class="g-eksen" aria-hidden="true"><span></span><span class="olcek">${isaret.map(v => `<span style="left:${yuzde(v)}">${v}</span>`).join("")}</span><span></span></div>
        </div>
      </section>
    </div>
  </div>`;
}

/* ---------- sorular ---------- */
function cizSorular(){
  const acikL = acikSorular().filter(filtre), bitti = soruListe().filter(q => q.durum === "cevaplandi").filter(filtre);
  const tum = [...acikL, ...bitti];
  if(!tum.some(q => q.id === secSoru)) secSoru = (acikL[0] || bitti[0] || {}).id || null;
  const satir = q => {
    const c = q.durum === "cevaplandi", d = c ? "yesil" : soruDurum(q);
    return `<button class="soru-satir s-${d}${c ? " cevaplandi" : ""}" data-soru="${q.id}" aria-current="${q.id === secSoru}">
      <span class="s1">${kanal(q.k)}<span class="m">${esc(q.m)}</span><span class="bk">${c ? "Cevaplandı" : `<span class="canli" data-bas="${q.bas}">${sure(simdi()-q.bas)}</span>`}</span></span>
      <span class="s2">${esc(q.u)}</span>
      <span class="s3">${esc(q.t)}</span>
      ${!c && d !== "yesil" ? `<span>${rozet(d, SOR_ET[d])}</span>` : ""}
    </button>`;
  };
  const q = D.sorular.find(x => x.id === secSoru);
  return `
  <p class="onay-notu">${IK.kilit}<span>Yapay zekâ her soruya taslak hazırlar. <b>İşletme onaylamadan hiçbir cevap gitmez.</b> Cevap hedefi: ${D.soruHedefDk/60} saat.</span></p>
  <section class="kart gelen">
    <div class="gelen-liste" id="soru-liste">
      <div class="grup-bas"><span>Bekliyor</span><span class="tn">${acikL.length}</span></div>
      ${acikL.map(satir).join("") || `<p class="bos">Bekleyen soru yok.</p>`}
      ${bitti.length ? `<div class="grup-bas"><span>Cevaplandı</span><span class="tn">${bitti.length}</span></div>${bitti.map(satir).join("")}` : ""}
    </div>
    <div class="detay" id="soru-detay">${q ? soruDetay(q) : `<p class="bos">Soru seçin.</p>`}</div>
  </section>`;
}
function soruDetay(q){
  const c = q.durum === "cevaplandi", d = c ? "yesil" : soruDurum(q);
  const sip = D.siparisler.find(s => s.m === q.m);
  const metin = c ? (q.gonderilen || sablon(q.x, q)) : sablon(q.x, q);
  const baglam = sip ? `<div><small>Sipariş</small><b class="tn">#${sip.no}</b></div><div><small>Ürün</small>${esc(sip.u)}${sip.a > 1 ? ` · ${sip.a} adet` : ""}</div><div><small>Durum</small>${rozet(sipDurum(sip), SIP_ET(sip))}</div><div><small>Sipariş tarihi</small><span class="tn">${tarihSaat(sip.bas)}</span></div>`
    : `<div><small>Sipariş</small>Açık siparişi yok</div><div><small>Ürün sayfası</small>${esc(q.u)}</div><div><small>Konu</small>${esc(q.konu)}</div>`;
  return `
    <div class="detay-bas s-${d}">
      <div><h2>${esc(q.m)}</h2><div class="bekleme" style="margin-top:4px">${kanal(q.k)} · ${esc(q.konu)} · ${c ? "cevaplandı" : `<b class="canli" data-bas="${q.bas}">${sure(simdi()-q.bas)}</b> bekliyor · hedef ${D.soruHedefDk/60} sa`}</div></div>
      <div class="sag">${c ? rozet("yesil","Cevaplandı") : rozet(d, SOR_ET[d])}</div>
    </div>
    <div class="soru-balon">${esc(q.t)}</div>
    <div><div class="hucre-alt" style="margin-bottom:6px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px">Sipariş bağlamı</div><div class="baglam">${baglam}</div></div>
    <div class="taslak" data-taslak>
      <div class="taslak-ust"><b>${c ? IK.tik + "Gönderilen cevap" : IK.yildiz + "Yapay zekâ taslağı"}</b><span>Bilgi bankası: ${esc(q.konu)} · Hitap: ${D.hitap === "siz" ? "Siz" : "Sen"}</span></div>
      <textarea id="taslak-metin" rows="5" readonly aria-label="Cevap metni">${esc(metin)}</textarea>
    </div>

    <div class="eylemler"><button class="btn birincil" data-eylem="gonder" data-id="${q.id}">${IK.tik.replace('viewBox','width="14" height="14" viewBox')}Onayla ve gönder</button><button class="btn" data-eylem="duzenle">Düzenle</button><button class="btn" data-eylem="atla" data-id="${q.id}">Atla</button></div>`}`;
}

/* ---------- siparişler ---------- */
const SIP_SEKME = [["gecikti","Gecikti"],["bugun","Bugün bitmeli"],["yolda","Yolda"],["hepsi","Hepsi"]];
function sipSiralaDeger(s, k){
  switch(k){
    case "no": return s.no; case "kanal": return KANAL[s.k]; case "urun": return s.u; case "musteri": return s.m;
    case "tarih": return s.bas; case "bekleme": return s.kargoda ? -1 : s.gun; case "kalan": return sipSon(s);
    case "takip": return s.takip || (s.kargoda ? "" : "~"); case "sorumlu": return s.sorumlu || "~";
    case "durum": return -AGIRLIK[sipDurum(s)];
  }
}
function cizSiparisler(){
  const ls = sipListe().filter(filtre);
  const say = {gecikti:0, bugun:0, yolda:0, hepsi:ls.length};
  ls.forEach(s => say[sipGrup(s)]++);
  const gor = ls.filter(s => sipSekme === "hepsi" || sipGrup(s) === sipSekme).sort((a,b) => {
    const x = sipSiralaDeger(a, sirala.k), y = sipSiralaDeger(b, sirala.k);
    const c = typeof x === "string" ? x.localeCompare(y, "tr") : (x === y ? 0 : x < y ? -1 : 1);
    return c * sirala.y || (a.bas - b.bas);
  });
  [...secili].forEach(no => { if(!gor.some(s => s.no === no && !s.kargoda)) secili.delete(no); });
  const sec = gor.filter(s => !s.kargoda);
  const hepsiSecili = sec.length && sec.every(s => secili.has(s.no));
  const th = (k, ad, cls) => `<th${cls ? ` class="${cls}"` : ""}${sirala.k === k ? ` aria-sort="${sirala.y > 0 ? "ascending" : "descending"}"` : ""}><button data-sirala="${k}">${ad}<span class="ok" aria-hidden="true">${sirala.k === k ? (sirala.y > 0 ? "▲" : "▼") : ""}</span></button></th>`;
  const satir = s => {
    const yol = s.kargoda;
    return `<tr data-siparis="${s.no}" class="${secili.has(s.no) ? "secili" : ""}">
      <td><input type="checkbox" data-sec="${s.no}" ${secili.has(s.no) ? "checked" : ""} ${yol ? "disabled" : ""} aria-label="#${s.no} seç"></td>
      <td class="hucre-ana tn">#${s.no}</td>
      <td>${kanal(s.k)}</td>
      <td><div class="urun-h" title="${esc(s.u)}">${esc(s.u)}</div>${s.a > 1 ? `<div class="hucre-alt">${s.a} adet</div>` : ""}</td>
      <td>${esc(s.m)}</td>
      <td class="tn">${tarihSaat(s.bas)}</td>
      <td class="tn sayi" data-bekleme>${yol ? `<span class="soluk">—</span>` : `<b${s.gun >= 2 ? ' style="color:var(--kirmizi)"' : ""}>${s.gun === 0 ? "Bugün" : s.gun + " gün"}</b>`}</td>
      <td class="tn" data-kalan>${yol ? `<span class="soluk">Kargoda</span>` : `<b class="canli" data-hedef="${sipSon(s)}">${kalanHtml(sipSon(s))}</b>`}</td>
      <td class="tn" data-takip>${s.takip ? esc(s.takip) : yol ? `<span class="takip-eksik">${IK.sari}Eksik</span>` : `<span class="soluk">Henüz yok</span>`}</td>
      <td><select data-sip-sorumlu="${s.no}" aria-label="#${s.no} sorumlusu"><option value="">Atanmadı</option>${D.ekip.map(e => `<option value="${esc(e.ad)}" ${s.sorumlu === e.ad ? "selected" : ""}>${esc(e.ad)}</option>`).join("")}</select></td>
      <td>${rozet(sipDurum(s), SIP_ET(s))}${s.mesaj ? `<div class="mesaj-gitti">${IK.tik}Gecikme mesajı gitti</div>` : ""}</td>
    </tr>`;
  };
  return `
  ${D.not ? `<p class="not">${IK.bilgi}<span>${esc(D.not)}</span></p>` : ""}
  <section class="kart">
    <div class="sekme-sira" role="tablist">${SIP_SEKME.map(([id, ad]) => `<button class="sekme" role="tab" data-sip-sekme="${id}" aria-selected="${sipSekme === id}">${ad}<span class="say${id === "gecikti" && say.gecikti ? " kirmizi" : ""} tn">${say[id]}</span></button>`).join("")}</div>
    <div class="eylem-cubugu">
      <span class="bilgi">${secili.size ? `<b class="tn" style="color:var(--yazi)">${secili.size}</b> sipariş seçili` : `Kargo son saati <b class="tn" style="color:var(--yazi)">${pad(D.kargoSaat)}:00</b> · kalan <b class="tn canli" style="color:var(--yazi)" data-hedef="${kesimMs()}">${kalanHtml(kesimMs())}</b>`}</span>
      <button class="btn birincil" data-eylem="gecikme" ${secili.size ? "" : "disabled"}>${IK.mesaj}Müşteriye gecikme mesajı</button>
    </div>
    ${gor.length ? `<div class="tablo-kap"><table>
      <thead><tr><th><input type="checkbox" data-sec-hepsi ${hepsiSecili ? "checked" : ""} ${sec.length ? "" : "disabled"} aria-label="Tümünü seç"></th>${th("no","Sipariş no")}${th("kanal","Kanal")}${th("urun","Ürün")}${th("musteri","Müşteri")}${th("tarih","Sipariş tarihi")}${th("bekleme","Bekleme","sayi")}${th("kalan","Son kargolamaya")}${th("takip","Takip no")}${th("sorumlu","Sorumlu")}${th("durum","Durum")}</tr></thead>
      <tbody>${gor.map(satir).join("")}</tbody></table></div>` : `<p class="bos">${arama || kanalF ? "Bu filtreyle eşleşen sipariş yok." : "Bu sekmede sipariş yok."}</p>`}
  </section>`;
}

/* ---------- iadeler ---------- */
function cizIadeler(){
  const ls = iadeListe().filter(filtre);
  const kart = r => {
    const a = iadeAdim(r), g = iadeGun(r), d = iadeDurum(r), bit = iadeBitti(r);
    const kisi = bit ? kisiRol("Muhasebe") : kisiRol(ADIM_ROL[a+1]);
    const sonG = bit ? r.ag[4] : g;
    const kalan = D.iadeSinir - g;
    const kalEt = bit ? `${IK.yesil}${r.ag[4]}. günde ödendi` : kalan > 1 ? `${IK[d]}${kalan} gün kaldı` : kalan === 1 ? `${IK.kirmizi}Son gün` : `${IK.kirmizi}${-kalan + 1} gün aşıldı`;
    const doluluk = Math.min(100, sonG / D.iadeSinir * 100);
    const esik = iadeEsik();
    return `<article class="iade-kart s-${d}${yeniKart === r.no ? " yeni" : ""}" data-iade="${r.no}">

      <div class="ik-urun">${esc(r.u)}</div>
      <div class="ik-bilgi"><span><b>${r.tl.toLocaleString("tr-TR")} TL</b></span><span>${esc(r.m)}</span></div>
      <div class="ik-bilgi"><span>Geçen <b>${g} gün</b></span><span>${bit ? "Kapatan" : "Sorumlu"} <b>${esc(kisi ? kisi.ad : "—")}</b></span></div>
      ${D.foto && a >= 2 ? `<div class="foto"><i></i><i></i><span>QC fotoğrafı, 2 adet</span></div>` : ""}
      <div class="sinir" data-sinir>
        <div class="et"><span>Ödeme sınırı</span><b>${Math.min(sonG, 99)}/${D.iadeSinir} gün</b></div>
        <div class="bar" role="img" aria-label="Ödeme sınırının ${sonG}. günü, sınır ${D.iadeSinir} gün"><span style="width:${doluluk.toFixed(1)}%"></span><i style="left:${(esik.sari/D.iadeSinir*100).toFixed(1)}%"></i><i style="left:${(esik.kirmizi/D.iadeSinir*100).toFixed(1)}%"></i></div>
        <span class="kal">${kalEt}</span>
      </div>
      <div class="ik-eylem">
        ${bit ? "" : `<button class="btn kucuk birincil" data-eylem="ilerlet" data-id="${r.no}" title="Sonraki adım: ${esc(D.adimlar[a+1])}">Adımı ilerlet ${IK.ok}</button>`}
        <button class="btn kucuk" data-eylem="baglanti" data-id="${r.no}">${IK.baglanti}Durum bağlantısı</button>
      </div>
    </article>`;
  };
  const sutun = (ad, i) => {
    const ic = ls.filter(r => iadeAdim(r) === i).sort((a,b) => iadeGun(b) - iadeGun(a));
    return `<div class="sutun" data-sutun="${i}"><div class="sutun-bas"><span class="no tn">${i+1}</span><span>${esc(ad)}</span><span class="say tn">${ic.length}</span></div>${ic.map(kart).join("")}</div>`;
  };
  return `
  <p class="not">${IK.bilgi}<span>Süre, müşterinin cayma bildiriminden itibaren sayılır. Ödeme sınırı: <b>${D.iadeSinir} gün</b> · sınırın %70'inde sarı, son gün kırmızı. Süreyi işletmenin hukuk danışmanı doğrular.</span></p>
  <div class="kanban-kap" data-kanban><div class="kanban">${D.adimlar.map(sutun).join("")}</div></div>`;
}

/* ================= katman (yan panel / pencere) ================= */
let perde = null;
function katmanAc(tur, baslik, govde, alt){
  katmanKapat(true);
  perde = document.createElement("div");
  perde.className = "perde " + tur; perde.dataset.eylem = "perde";
  perde.innerHTML = `<div class="panel" role="dialog" aria-modal="true" aria-label="${esc(baslik)}"><div class="panel-bas"><h3>${baslik}</h3><button class="kapat" data-eylem="kapat" aria-label="Kapat">×</button></div><div class="panel-govde">${govde}</div>${alt ? `<div class="panel-alt">${alt}</div>` : ""}</div>`;
  document.body.appendChild(perde);
  requestAnimationFrame(() => perde && perde.classList.add("acik"));
  const k = perde.querySelector(".kapat"); if(k) k.focus({preventScroll:true});
}
function katmanKapat(hemen){
  if(!perde) return;
  const p = perde; perde = null;
  if(hemen){ p.remove(); return; }
  p.classList.remove("acik"); setTimeout(() => p.remove(), 220);
}
function gecikmeMetni(s){
  return sablon(`Merhaba {ad}, #${s.no} numaralı [siparişiniz|siparişin] beklenenden geç hazırlandı, özür dileriz. Bugün {kesim} kadar kargoya verilecek; takip numarası gelince hemen ileteceğiz. [Anlayışınız|Anlayışın] için teşekkürler. {marka}`, s);
}
function gecikmeAc(){
  const ls = D.siparisler.filter(s => secili.has(s.no)); if(!ls.length) return;
  const yer = s => s.k === "site" ? "SMS" : s.k === "whatsapp" ? "WhatsApp" : KANAL[s.k] + " mesajı";
  const govde = `<p class="soluk" style="margin:0">${ls.length} müşteriye hazır gecikme bildirimi. Hitap: ${D.hitap === "siz" ? "Siz" : "Sen"}.</p>

function baglantiAc(no){
  const r = D.iadeler.find(x => x.no === no); if(!r) return;

/* ================= olaylar ================= */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-sayfa],[data-marka],[data-kanal],[data-soru],[data-eylem],[data-ayar],[data-sip-sekme],[data-sirala],[data-git-sayfa]");
  if(!t) return;
  if(t.dataset.eylem === "perde" && e.target !== t) return;
  if(t.dataset.sayfa){ sayfayaGit(t.dataset.sayfa); return; }
  if(t.dataset.marka){ markaDegis(t.dataset.marka); return; }
  if(t.dataset.kanal !== undefined){ kanalF = t.dataset.kanal || null; ciz(); return; }
  if(t.dataset.soru){ secSoru = t.dataset.soru; ciz(); if(innerWidth < 760){ const dt = $("#soru-detay"); dt && dt.scrollIntoView({block:"start"}); } return; }
  if(t.dataset.ayar){ ayarla(t.dataset.ayar, t.dataset.v); return; }
  if(t.dataset.sipSekme){ sipSekme = t.dataset.sipSekme; ciz(); return; }
  if(t.dataset.sirala){ const k = t.dataset.sirala; sirala = sirala.k === k ? {k, y:-sirala.y} : {k, y:1}; ciz(); return; }
  if(t.dataset.gitSayfa){ const s = t.dataset.gitSayfa, id = t.dataset.gitId; if(s === "sorular") secSoru = id; if(s === "siparisler"){ sipSekme = "hepsi"; } sayfayaGit(s); vurgulaId(s, id); return; }
  const id = t.dataset.id;
  switch(t.dataset.eylem){
    case "perde": case "kapat": katmanKapat(); break;
    case "duzenle": { const ta = $("#taslak-metin"); if(!ta) break; ta.readOnly = false; ta.classList.add("duzenleniyor"); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); t.textContent = "Düzenleniyor"; t.disabled = true; break; }
    case "duzenle-hepsi": { $$(".gecikme-metin").forEach(ta => { ta.readOnly = false; ta.classList.add("duzenleniyor"); }); const f = $(".gecikme-metin"); f && f.focus(); t.textContent = "Düzenleniyor"; t.disabled = true; break; }
    case "gonder": {
      const q = D.sorular.find(x => x.id === id); if(!q) break;
      q.gonderilen = $("#taslak-metin").value; q.durum = "cevaplandi"; oturumKapanan++;
      const sira = acikSorular().filter(filtre); secSoru = (sira[0] || q).id;
      ciz(); bildir("Gönderildi (demo)"); break;
    }
    case "atla": {
      const sira = acikSorular().filter(filtre); const i = sira.findIndex(x => x.id === id);
      if(sira.length > 1){ secSoru = sira[(i+1) % sira.length].id; ciz(); bildir("Atlandı; liste sırası korunuyor"); } else bildir("Başka bekleyen soru yok");
      break;
    }
    case "gecikme": gecikmeAc(); break;
    case "gecikme-gonder": {
      const n = secili.size;
      D.siparisler.forEach(s => { if(secili.has(s.no)) s.mesaj = true; });
      oturumKapanan += n; secili.clear(); katmanKapat(); ciz(); bildir(`Gönderildi (demo) · ${n} mesaj`); break;
    }
    case "ilerlet": {
      const r = D.iadeler.find(x => x.no === id); if(!r || iadeBitti(r)) break;
      r.ag.push(Math.max(iadeGun(r), r.ag[r.ag.length-1])); yeniKart = r.no;
      if(iadeBitti(r)) oturumKapanan++;
      ciz(); bildir(iadeBitti(r) ? `${r.no}: para iadesi işlendi` : `${r.no}: ${D.adimlar[iadeAdim(r)]}`); break;
    }
    case "baglanti": baglantiAc(id); break;
    case "kopyala": {
      const url = `foyoperasyon.örnek/i/${id}`;
      try{ navigator.clipboard.writeText(url).then(() => bildir("Bağlantı kopyalandı"), () => bildir("Kopyalanamadı; adresi seçip kopyalayın")); }catch(err){ bildir("Kopyalanamadı; adresi seçip kopyalayın"); }
      break;
    }
    case "ekip-sil": { if(D.ekip.length > 1){ const [x] = D.ekip.splice(+t.dataset.i, 1); D.siparisler.forEach(s => { if(s.sorumlu === x.ad) s.sorumlu = undefined; }); ciz(); bildir(`${x.ad} çıkarıldı`); } else bildir("En az bir kişi kalmalı"); break; }
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if(t.id === "ay-kargo"){ ayarla("kargo", t.value); return; }
  if(t.id === "marka-mobil"){ markaDegis(t.value); return; }
  if(t.dataset.sipSorumlu){ const s = D.siparisler.find(x => x.no === t.dataset.sipSorumlu); s.sorumlu = t.value || undefined; ciz(); bildir(t.value ? `#${s.no}: sorumlu ${t.value}` : `#${s.no}: sorumlu kaldırıldı`); return; }
  if(t.dataset.sec){ t.checked ? secili.add(t.dataset.sec) : secili.delete(t.dataset.sec); ciz(); return; }
  if(t.dataset.secHepsi !== undefined){ $$("[data-sec]").forEach(c => { if(!c.disabled){ t.checked ? secili.add(c.dataset.sec) : secili.delete(c.dataset.sec); } }); ciz(); return; }
});
document.addEventListener("input", e => {
  if(e.target.id === "ay-ad"){ D.ad = e.target.value; temaUygula(); const o = $("#onizleme"); if(o) o.innerHTML = onizleme(); }
  if(e.target.id === "arama"){ arama = e.target.value.trim().toLocaleLowerCase("tr"); ciz(); }
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && perde) katmanKapat(); });
document.addEventListener("submit", e => {
  if(e.target.id !== "ekip-form") return;
  e.preventDefault();
  const ad = $("#ekip-ad").value.trim(); if(!ad){ $("#ekip-ad").focus(); return; }
  D.ekip.push({ad, rol: $("#ekip-rol").value}); ciz(); bildir(`${ad} eklendi`);
});
function ayarla(ad, v){
  if(ad === "renk") D.renk = v;
  if(ad === "hitap") D.hitap = v;
  if(ad === "hedef") D.soruHedefDk = +v;
  if(ad === "kargo") D.kargoSaat = +v;
  if(ad === "sinir") D.iadeSinir = +v;
  if(ad === "kanal"){ if(D.kanallar[v] && KANAL_SIRA.filter(acik).length === 1){ bildir("En az bir kanal açık kalmalı"); return; } D.kanallar[v] = !D.kanallar[v]; }
  temaUygula(); ciz();
}
function markaDegis(id){
  if(!MARKALAR[id]) return;
  katmanKapat(true); markaYukle(id); ciz();
}
function vurgulaId(s, id){
  const el = s === "sorular" ? $(`[data-soru="${CSS.escape(id)}"]`) : s === "siparisler" ? $(`tr[data-siparis="${CSS.escape(id)}"]`) : $(`[data-iade="${CSS.escape(id)}"]`);
  if(el){ el.scrollIntoView({block:"center"}); el.classList.add("vurgu"); setTimeout(() => el.classList.remove("vurgu"), 3000); }
}

/* ================= canlı sayaç ================= */
let sonImza = "";
function imza(){ return D ? [acikSorular().map(soruDurum).join(""), acikIade().map(iadeDurum).join(""), new Date(simdi()).getHours() >= D.kargoSaat].join("|") : ""; }
function tik(){
  const n = simdi();
  $$(".canli").forEach(el => {
    if(el.dataset.bas) el.textContent = sure(n - +el.dataset.bas);
    else if(el.dataset.hedef) el.innerHTML = kalanHtml(+el.dataset.hedef);
  });
  const d = new Date(n);
  $("#zaman").textContent = `${GUNLER[d.getDay()]}, ${tarih(n)} ${d.getFullYear()} · ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
setInterval(() => {
  tik();
  const i = imza();
  if(i !== sonImza){
    const eski = sonImza; sonImza = i;
    const yaziyor = document.activeElement && /^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement.tagName);
    if(eski && !perde && !TUR.aktif && !yaziyor) ciz();
  }
}, 1000);

/* ================= marka seçiciler ================= */
$("#marka-liste").innerHTML = Object.values(MARKALAR).map(m =>
  `<button class="marka-btn" data-marka="${m.id}" aria-pressed="false" title="${m.ad} · ${m.sektor}"><span class="mlogo ${m.sekil}" style="background:${RENKLER[m.renk].a}">${m.harf}</span><span class="yazi"><span class="ad">${m.ad}</span><small>${m.sektor}</small></span></button>`).join("");
$("#marka-mobil").innerHTML = Object.values(MARKALAR).map(m => `<option value="${m.id}">${m.ad}</option>`).join("");

/* ================= sunum turu ================= */
const TUR = {aktif:false, no:0};
const imlec = $("#imlec"), altyazi = $("#altyazi");
const azHareket = matchMedia("(prefers-reduced-motion: reduce)").matches;
function bekle(ms){ const n = TUR.no; return new Promise((ok, red) => setTimeout(() => n === TUR.no ? ok() : red("iptal"), ms)); }
function yaz(m){
  const s = altyazi.firstElementChild; altyazi.hidden = false;
  s.classList.add("sil");
  setTimeout(() => { s.textContent = m; s.classList.remove("sil"); }, azHareket ? 0 : 160);
}
let imlecXY = null;
function imlecKoy(x, y){ imlec.hidden = false; imlec.style.transform = `translate(${x}px,${y}px)`; imlecXY = [x, y]; }
function gorunur(el){
  if(!el) return;
  const r = el.getBoundingClientRect();
  const ustBosluk = ($(".ust") ? $(".ust").getBoundingClientRect().bottom : 0) + 12;
  if(r.top < ustBosluk || r.bottom > innerHeight - 170) el.scrollIntoView({block:"center", inline:"nearest"});
}
async function git(el){
  if(!el) return;
  gorunur(el);
  await bekle(80);
  const r = el.getBoundingClientRect();
  const x = r.left + Math.min(r.width/2, 90), y = r.top + Math.min(r.height/2, 26);
  if(!imlecXY){ imlecKoy(innerWidth*0.55, innerHeight*0.55); await bekle(40); }
  imlecKoy(x, y);
  await bekle(azHareket ? 200 : 700);
}
const bul = sel => typeof sel === "string" ? $(sel) : sel;
async function tikla(sel){
  const el = bul(sel);
  if(!el){ console.warn("tur: hedef yok", sel); return; }
  await git(el);
  imlec.classList.remove("dokun"); void imlec.offsetWidth; imlec.classList.add("dokun");
  await bekle(200);
  el.click();
  await bekle(300);
}
async function sec(sel, deger){
  const el = bul(sel); if(!el) return;
  await git(el);
  imlec.classList.remove("dokun"); void imlec.offsetWidth; imlec.classList.add("dokun");
  await bekle(200);
  el.value = deger; el.dispatchEvent(new Event("change", {bubbles:true}));
  await bekle(300);
}
function vurgula(sel){
  const el = bul(sel); if(!el) return;
  gorunur(el);
  el.classList.remove("vurgu"); void el.offsetWidth; el.classList.add("vurgu");
  setTimeout(() => el.classList.remove("vurgu"), 3000);
}
async function yazarakEkle(el, metin){
  for(const ch of metin){ el.value += ch; el.scrollTop = el.scrollHeight; await bekle(azHareket ? 5 : 45); }
}
function basla(id){ markaDegis(id || "lal"); arama = ""; $("#arama").value = ""; sipSekme = "hepsi"; sirala = {k:"kalan", y:1}; sayfayaGit("genel"); }

  vurgula("[data-tablo] tbody tr"); yaz("En üstte, süresi en az kalan iş."); await bekle(3200);

  await tikla('[data-kanal="whatsapp"]');
  yaz("Kanal seçin, tablo yalnız onu gösterir."); await bekle(2800);
  await tikla('[data-kanal=""]');

  basla("lal");
  yaz("Sorular: tüm kanallar tek gelen kutusunda."); await bekle(1200);
  await tikla('.menu [data-sayfa="sorular"]');
  await bekle(1000);
  const ilk = $(".soru-satir"); const q = D.sorular.find(x => x.id === ilk.dataset.soru);
  const saat = Math.floor((simdi() - q.bas)/3600000);
  vurgula(ilk); yaz(`Bu müşteri ${saat >= 1 ? saat + " saattir" : "dakikalardır"} cevap bekliyor.`); await bekle(3000);
  vurgula("[data-taslak]"); yaz("Yapay zekâ cevap taslağını çoktan hazırladı."); await bekle(3200);
  await tikla('[data-eylem="duzenle"]');
  yaz("İsterseniz taslağı düzenleyip kendi dilinize uyarlarsınız."); await yazarakEkle($("#taslak-metin"), " İyi günler dileriz."); await bekle(1600);
  vurgula("[data-onay]"); yaz("İşletme onaylamadan hiçbir cevap müşteriye gitmez."); await bekle(3000);
  await tikla('[data-eylem="gonder"]');
  yaz("Gönderildi; liste güncellendi, sıradaki soru açıldı."); await bekle(3000);
  await tikla('[data-eylem="atla"]');
  yaz("Beklemesi gerekeni atlayıp sonra geri dönersiniz."); await bekle(2700);
  vurgula('.menu [data-sayfa="sorular"]'); yaz("Bekleyen sayısı her cevapla biraz daha azalır."); await bekle(2600);
}
async function turSiparisler(){
  basla("lal");
  yaz("Kargo gecikmesi, incelenen şikâyetlerde en sık konu."); await bekle(1200);
  await tikla('.menu [data-sayfa="siparisler"]');
  await bekle(800);
  await tikla('[data-sip-sekme="gecikti"]');
  yaz("Geciken siparişler tek tıkla ayrı listede."); await bekle(1800);
  const ilk = $("tbody tr[data-siparis]"); const s = D.siparisler.find(x => x.no === ilk.dataset.siparis);
  vurgula(ilk.querySelector("[data-bekleme] b")); vurgula(ilk); yaz(`Bu sipariş ${s.gun} gündür kargoya verilmedi.`); await bekle(2600);
  vurgula(ilk.querySelector("[data-kalan]")); yaz("Kargo son saatine kalan süre canlı sayılır."); await bekle(2400);
  await sec(ilk.querySelector("[data-sip-sorumlu]"), "Mehmet");
  yaz("Sorumluyu seçin; iş artık Mehmet'in üstünde."); await bekle(2600);
  await tikla("[data-sec-hepsi]");
  yaz("Gecikenleri seçip müşterilere tek seferde haber verin."); await bekle(1900);
  await tikla('[data-eylem="gecikme"]');
  yaz("Mesaj hazır; gitmeden önce siz okursunuz."); await bekle(2600);
  await tikla('[data-eylem="gecikme-gonder"]');
  yaz("Onaylandı. Sonuç kayda geçti."); await bekle(2400);
  await tikla('[data-sip-sekme="yolda"]');
  const eksik = $$("tbody tr[data-siparis]").find(x => x.querySelector(".takip-eksik"));
  if(eksik){ vurgula(eksik); yaz("Takip numarası eksik olan sipariş de görünür."); await bekle(2400); }
}
async function turIadeler(){
  basla("lal");
  yaz("İade parası nerede kaldı, kimde bekliyor?"); await bekle(1200);
  await tikla('.menu [data-sayfa="iadeler"]');
  await bekle(800);
  vurgula("[data-kanban]"); yaz("Her iade, bulunduğu adımın sütununda durur."); await bekle(3000);
  const hedef = "R-2038", r = D.iadeler.find(x => x.no === hedef);
  vurgula(`[data-iade="${hedef}"] [data-sinir]`); yaz(`Ödeme sınırı ${D.iadeSinir} gün; bu iade ${iadeGun(r)}. günde.`); await bekle(3200);
  await tikla(`[data-iade="${hedef}"] [data-eylem="ilerlet"]`);
  yaz("Adımı ilerletin; kart bir sonraki sütuna geçer."); await bekle(2600);
  await tikla(`[data-iade="${hedef}"] [data-eylem="ilerlet"]`);
  await tikla(`[data-iade="${hedef}"] [data-eylem="ilerlet"]`);
  vurgula(`[data-iade="${hedef}"]`); yaz("Onay ve para iadesi: süre dolmadan kapandı."); await bekle(3000);
  await tikla(`[data-iade="${hedef}"] [data-eylem="baglanti"]`);
  yaz("Müşteri durumunu bu sayfadan kendisi izler."); await bekle(3600);
  await tikla('.panel-alt [data-eylem="kapat"]');
  yaz("Müşteri durumunu sormadan görebilir."); await bekle(2400);
}
async function turKisisellestir(){
  basla("lal");
  yaz("Aynı panel, her işletmeye göre ayarlanır."); await bekle(2000);
  if(innerWidth >= 760) await tikla('.marka-liste [data-marka="pitircik"]'); else markaDegis("pitircik");
  yaz("Pıtırcık Oyuncak: turuncu renk, samimi sen dili."); await bekle(2600);
  await tikla('.menu [data-sayfa="ayarlar"]');
  yaz("Ayarlar solda, sonucu sağda anında görürsünüz."); await bekle(2600);

  yaz("Ana rengi değiştirin, panel hemen uyum sağlar."); await bekle(2200);
  await tikla("#ay-hitap-siz");
  vurgula("[data-oz-taslak]"); yaz("Hitabı seçin: taslak cevaplar o dille yazılır."); await bekle(2800);
  await tikla("#ay-hedef-60");
  vurgula("[data-oz-kpi]"); yaz("Soru hedefini kısaltın, kırmızılar ona göre hesaplanır."); await bekle(2800);
  await tikla("#ay-sinir-30");
  yaz("İade ödeme sınırı: 10, 14 ya da 30 gün."); await bekle(2600);
  vurgula("[data-kurulum]"); yaz("Ayarlar kurulumda işletmeyle birlikte doldurulur."); await bekle(2600);

async function kapanis(){
  altyazi.hidden = true; imlec.hidden = true;
  const k = $("#kapanis"); k.hidden = false; requestAnimationFrame(() => k.classList.add("goster"));
  await bekle(4500);
}
const TURLAR = {"tur-genel":[turGenel], "tur-sorular":[turSorular], "tur-siparisler":[turSiparisler], "tur-iadeler":[turIadeler], "tur-kisisellestir":[turKisisellestir],
  "tur-hepsi":[turGenel, turSorular, turSiparisler, turIadeler, turKisisellestir]};

async function turBaslat(ad){
  const adimlar = TURLAR[ad]; if(!adimlar) return;
  TUR.no++; TUR.aktif = true; window.__turBitti = false; window.__turBolum = [];
  const no = TUR.no;
  document.documentElement.classList.add("tur");
  $("#kapanis").hidden = true; $("#kapanis").classList.remove("goster");
  imlecXY = null;
  const t0 = performance.now();
  try{
    await bekle(400);
    for(const f of adimlar){ const t1 = performance.now(); katmanKapat(true); await f(); window.__turBolum.push(Math.round((performance.now() - t1)/100)/10); }
    await kapanis();
    if(no === TUR.no){ window.__turSure = Math.round((performance.now() - t0)/100)/10; window.__turBitti = true; }
  }catch(e){ if(e !== "iptal"){ console.error(e); window.__turBitti = true; } }
}
function turBitir(){
  TUR.no++; TUR.aktif = false;
  document.documentElement.classList.remove("tur");
  altyazi.hidden = true; imlec.hidden = true; $("#kapanis").hidden = true;
}

/* ================= başlangıç ve hash ================= */
function hashOku(ilk){
  const h = decodeURIComponent(location.hash.replace("#",""));
  if(TURLAR[h]){ turBaslat(h); return; }
  if(TUR.aktif) turBitir();
  if(h.startsWith("marka-")){ const id = h.slice(6); if(MARKALAR[id]){ markaDegis(id); return; } }
  if(SAYFALAR.some(x => x[0] === h)){ if(ilk){ ilkMarka(); } sayfayaGit(h); return; }
  if(ilk){ ilkMarka(); ciz(); }
}
function ilkMarka(){ let id = "lal"; try{ const s = localStorage.getItem("foyop-marka"); if(s && MARKALAR[s]) id = s; }catch(e){} markaYukle(id); }
addEventListener("hashchange", () => hashOku(false));
markaYukle("lal");
hashOku(true);
sonImza = imza();
})();
</script>
